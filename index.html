<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#7c3aed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Thomas's World</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{background:#1a0a2e;color:#e2d0f8;display:flex;align-items:center;justify-content:center;}
#app{width:100%;max-width:420px;height:100dvh;background:#1a0a2e;position:relative;overflow:hidden;display:flex;flex-direction:column;}
canvas#bgc{position:absolute;inset:0;pointer-events:none;z-index:0;}
.screen{display:none;flex-direction:column;height:100%;position:relative;z-index:1;}
.screen.active{display:flex;}
.hdr{background:rgba(18,6,42,.88);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{color:#c084fc;font-size:15px;font-weight:600;}
.coin-badge{display:flex;align-items:center;gap:5px;background:#2a1040;border-radius:20px;padding:4px 10px;color:#fbbf24;font-size:13px;font-weight:600;}
.xp-wrap{background:rgba(18,6,42,.88);padding:0 16px 10px;flex-shrink:0;}
.xp-row{display:flex;justify-content:space-between;font-size:11px;color:#a78bcc;margin-bottom:4px;}
.xp-track{background:#2a1040;border-radius:10px;height:8px;overflow:hidden;}
.xp-fill{background:#9333ea;height:100%;border-radius:10px;transition:width .8s ease;}
.nav{display:flex;background:#12062a;border-top:1px solid #3a1a5e;flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;background:none;border:none;cursor:pointer;color:#7a5a9a;font-size:9px;font-family:inherit;outline:none;}
.nb svg{width:22px;height:22px;pointer-events:none;}
.nb span{pointer-events:none;}
.nb.on{color:#c084fc;}
.home-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px;}
.lvl-badge{background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:3px 16px;border-radius:20px;margin-bottom:6px;}
#char-wrap{position:relative;width:190px;height:255px;flex-shrink:0;}
#char-wrap svg,#char-wrap div>svg{position:absolute;top:0;left:0;width:190px;height:255px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-top:10px;}
.sc{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:10px;text-align:center;}
.sc .v{color:#c084fc;font-size:20px;font-weight:600;}
.sc .l{color:#7a5a9a;font-size:10px;margin-top:2px;}
.mlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.mc{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none;user-select:none;}
.mc.done{opacity:.5;}
.mc.pend{border-color:#fbbf24;}
.mi{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.c-teal{background:#002a1a;}.c-amber{background:#2a1a00;}.c-purple{background:#2e1060;}.c-pink{background:#2a001a;}
.mt{color:#e2d0f8;font-size:13px;font-weight:500;}
.md{color:#7a5a9a;font-size:11px;margin-top:2px;}
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.pill{border-radius:20px;padding:2px 8px;font-size:10px;}
.pg{background:#2a1040;color:#fbbf24;}
.ok{background:#0a2a10;color:#34d399;}
.wt{background:#2a1a00;color:#fbbf24;}
.shop-body{flex:1;overflow-y:auto;padding:10px 13px;}
.sst{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 6px;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.si{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;}
.si.own{border-color:#34d399;}
.si .ie{font-size:24px;margin-bottom:4px;}
.si .in{color:#e2d0f8;font-size:10px;font-weight:500;line-height:1.2;min-height:28px;display:flex;align-items:center;justify-content:center;}
.stg{border-radius:20px;padding:2px 6px;font-size:10px;display:inline-block;margin-top:4px;}
.tp{background:#2a1040;color:#fbbf24;}
.to{background:#0a2a10;color:#34d399;}
.tb{background:#2a0808;color:#f87171;}
.pb{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.pin-area{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0;}
.pdots{display:flex;gap:12px;}
.pd{width:14px;height:14px;border-radius:50%;background:#3a1a5e;border:1.5px solid #7c3aed;transition:background .2s;}
.pd.on{background:#c084fc;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px;}
.pk{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:14px 0;text-align:center;font-size:20px;color:#e2d0f8;cursor:pointer;font-weight:500;}
.pk:active{background:#2a1040;}
.slbl{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px;}
.cd{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.di{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;}
.di:focus{border-color:#7c3aed;}
.ds{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;}
.bpu{background:#7c3aed;border:none;border-radius:10px;color:#fff;padding:10px;font-size:13px;font-family:inherit;cursor:pointer;width:100%;}
.bpu:active{opacity:.85;}
.bgr{background:#0a2a10;border:1px solid #34d399;border-radius:8px;color:#34d399;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.brd{background:#2a0a10;border:1px solid #f87171;border-radius:8px;color:#f87171;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.ac{background:#12062a;border:1.5px solid #fbbf24;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #3a1a5e;}
.mrow:last-child{border-bottom:none;}
.crow{display:flex;align-items:center;gap:8px;background:#0d0620;border-radius:8px;padding:7px 10px;}
.crow span{color:#e2d0f8;font-size:12px;flex:1;}
#eq-modal{position:absolute;inset:0;background:rgba(8,2,20,.95);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
#eq-modal.show{display:flex;}
#eq-char{position:relative;width:160px;height:213px;transform-origin:bottom center;}
#eq-char svg,#eq-char div>svg{position:absolute;top:0;left:0;width:160px;height:213px;}
#eq-emoji{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;z-index:10;}
.eq-txt{color:#fbbf24;font-size:16px;font-weight:700;opacity:0;}
.eq-sub{color:#c084fc;font-size:12px;opacity:0;}
.eq-btn{background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:0;}
.bp{position:absolute;pointer-events:none;z-index:50;font-size:var(--sz);animation:burst var(--dur) ease-out forwards;}
.cban{position:absolute;left:50%;background:#7c3aed;color:#fff;padding:8px 18px;border-radius:24px;font-size:12px;font-weight:600;pointer-events:none;z-index:60;white-space:nowrap;animation:banpop 2.5s ease-out forwards;}
#toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;display:none;}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2);opacity:0;}}
@keyframes banpop{0%{opacity:0;transform:translateX(-50%) scale(.6);}15%{opacity:1;transform:translateX(-50%) scale(1.08);}25%{transform:translateX(-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(.8) translateY(-16px);}}
@keyframes spinin{0%{transform:translateX(-50%) translateY(-70px) rotate(540deg) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(8px) rotate(-20deg) scale(1.5);opacity:1;}70%{transform:translateX(-50%) translateY(-6px) rotate(10deg) scale(.85);}82%{transform:translateX(-50%) translateY(4px) rotate(-5deg) scale(1.1);}100%{transform:translateX(-50%) translateY(0) rotate(0) scale(1);opacity:1;}}
@keyframes min{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
</style>
</head>
<body>
<div id="app">
<canvas id="bgc"></canvas>
<div class="screen active" id="s-home">
  <div class="hdr"><div><div style="color:#a78bcc;font-size:10px;">Bem-vindo,</div><div class="hdr-title">Thomas ⚔️</div></div><div class="coin-badge">🪙 <span class="cd">500</span></div></div>
  <div class="xp-wrap"><div class="xp-row"><span id="hlvl">Nível 1</span><span id="hxp">0/200 XP</span></div><div class="xp-track"><div class="xp-fill" id="hbar" style="width:0%"></div></div></div>

</div>
<div id="eq-modal">
  <div style="color:#a78bcc;font-size:11px;letter-spacing:3px;">✨ EQUIPANDO ✨</div>
  <div id="eq-char"><div id="eq-emoji"></div></div>
  <div class="eq-txt" id="eqtxt"></div>
  <div class="eq-sub" id="eqsub"></div>
  <button class="eq-btn" id="eqbtn" onclick="closeEq()">Incrível! 🎉</button>
</div>
<div id="toast"></div>
</div>
<script>
// ── DATA ──────────────────────────────────────────────────
const CAT = [

  {id:'jkt-k',  name:'Jaqueta Preta',   price:280, e:'🧥',cat:'Roupas',  slot:'jacket',c:'#1F2937'},
  {id:'cape',   name:'Capa Roxa',       price:350, e:'🦸',cat:'Roupas',  slot:'jacket',t:'cape'},
  {id:'armor',  name:'Armadura Épica',  price:900, e:'🛡',cat:'Roupas',  slot:'jacket',t:'armor'},
  {id:'crown-g',name:'Coroa Dourada',   price:400, e:'👑',cat:'Chapéus', slot:'head',  t:'crown-g'},
  {id:'crown-s',name:'Coroa de Prata',  price:250, e:'👑',cat:'Chapéus', slot:'head',  t:'crown-s'},
  {id:'helmet', name:'Elmo de Ferro',   price:350, e:'⛑️',cat:'Chapéus', slot:'head',  ep:[340,50,46]},
  {id:'wizard', name:'Chapéu Mago',     price:450, e:'🧙',cat:'Chapéus', slot:'head',  ep:[340,46,48]},
  {id:'cowboy', name:'Chapéu Cowboy',   price:300, e:'🤠',cat:'Chapéus', slot:'head',  ep:[340,46,46]},
  {id:'halo',   name:'Auréola',         price:500, e:'😇',cat:'Chapéus', slot:'head2', ep:[340,42,32]},
  {id:'sw-wood',name:'Espada Madeira',  price:80,  e:'🗡️',cat:'Armas',   slot:'weapon',t:'sw-wood'},
  {id:'sw-iron',name:'Espada Ferro',    price:200, e:'⚔️',cat:'Armas',   slot:'weapon',t:'sw-iron'},
  {id:'sw-leg', name:'Espada Lendária', price:600, e:'🗡️',cat:'Armas',   slot:'weapon',t:'sw-leg'},
  {id:'bow',    name:'Arco e Flecha',   price:350, e:'🏹',cat:'Armas',   slot:'weapon',ep:[455,370,40]},
  {id:'staff',  name:'Cajado Mágico',   price:500, e:'🪄',cat:'Armas',   slot:'weapon',ep:[455,360,40]},
  {id:'trident',name:'Tridente',        price:700, e:'🔱',cat:'Armas',   slot:'weapon',ep:[455,380,40]},
  {id:'hammer', name:'Martelo',         price:800, e:'🪓',cat:'Armas',   slot:'weapon',ep:[455,370,40]},
  {id:'sh-wood',name:'Escudo Madeira',  price:60,  e:'🛡️',cat:'Escudos', slot:'shield',t:'sh-wood'},
  {id:'sh-iron',name:'Escudo Ferro',    price:180, e:'🛡️',cat:'Escudos', slot:'shield',t:'sh-iron'},
  {id:'sh-magic',name:'Escudo Mágico', price:450, e:'🛡️',cat:'Escudos', slot:'shield',t:'sh-magic'},
  {id:'cat',    name:'Gatinho',         price:200, e:'🐱',cat:'Pets',    slot:'pet',   ep:[192,488,44]},
  {id:'dog',    name:'Cachorrinho',     price:250, e:'🐶',cat:'Pets',    slot:'pet',   ep:[192,488,44]},
  {id:'bunny',  name:'Coelho',          price:300, e:'🐰',cat:'Pets',    slot:'pet',   ep:[192,488,44]},
  {id:'fox',    name:'Raposa Mágica',   price:600, e:'🦊',cat:'Pets',    slot:'pet',   t:'fox'},
  {id:'dragon', name:'Dragãozinho',     price:1200,e:'🐉',cat:'Pets',    slot:'pet',   t:'dragon'},
  {id:'unicorn',name:'Unicórnio',       price:2000,e:'🦄',cat:'Pets',    slot:'pet',   ep:[192,488,50]},
  {id:'wings',  name:'Asas de Anjo',    price:1000,e:'🪽',cat:'Especiais',slot:'back', ep:[340,295,88]},
  {id:'jetpack',name:'Jetpack',         price:1500,e:'🚀',cat:'Especiais',slot:'back', ep:[415,300,50]},
  {id:'bkpack', name:'Mochila Épica',   price:300, e:'🎒',cat:'Especiais',slot:'back', ep:[415,280,44]},
  {id:'rainbow',name:'Aura Arco-íris',  price:1800,e:'🌈',cat:'Especiais',slot:'back', ep:[340,200,90]},
];
const DMISSIONS = [
  {id:'m1',title:'Escovar os dentes',     desc:'Manhã e noite',            xp:30, c:20,e:'🦷',tag:'teal'},
  {id:'m2',title:'Ler por 15 minutos',    desc:'Qualquer livro',            xp:50, c:30,e:'📖',tag:'amber'},
  {id:'m3',title:'Arrumar a cama',        desc:'Todo dia de manhã',         xp:30, c:15,e:'🛏️',tag:'purple'},
  {id:'m4',title:'Guardar as roupas',     desc:'Deixar tudo no lugar',      xp:25, c:15,e:'👕',tag:'pink'},
  {id:'m5',title:'Dever de casa',         desc:'Todas as matérias',         xp:80, c:50,e:'📚',tag:'teal'},
  {id:'m6',title:'Tomar banho',           desc:'Sem precisar pedir',        xp:40, c:25,e:'🚿',tag:'amber'},
  {id:'m7',title:'Arrumar a mesa',        desc:'Antes do jantar',           xp:35, c:20,e:'🍽️',tag:'purple'},
  {id:'m8',title:'Brincar sem tela',      desc:'30 minutos',                xp:45, c:25,e:'🎮',tag:'pink'},
  {id:'m9',title:'Comer as verduras',     desc:'No almoço ou jantar',       xp:40, c:20,e:'🥦',tag:'teal'},
  {id:'m10',title:'Guardar brinquedos',   desc:'Depois de brincar',         xp:25, c:15,e:'🧸',tag:'amber'},
];

// ── STATE ─────────────────────────────────────────────────
let P={coins:500,xp:0,done:0,owned:[],slots:{},pin:'1234',pending:[]};
let MS = DMISSIONS.map(m=>({...m,st:'ok'}));
let CI=[],CM=[];

function load(){
  try{
    const p=localStorage.getItem('tw2-p'); if(p) P=JSON.parse(p);
    const m=localStorage.getItem('tw2-m');
    if(m){
      const saved=JSON.parse(m);
      MS=DMISSIONS.map(d=>{
        const s=saved.find(x=>x.id===d.id);
        return {...d, st: s?s.st:'ok'};
      });
      // append any custom missions already in saved that aren't in DMISSIONS
    }
    const ci=localStorage.getItem('tw2-ci'); if(ci) CI=JSON.parse(ci);
    const cm=localStorage.getItem('tw2-cm'); if(cm) CM=JSON.parse(cm);
  }catch(e){console.warn('load err',e);}
}
function save(){
  try{
    localStorage.setItem('tw2-p',JSON.stringify(P));
    localStorage.setItem('tw2-m',JSON.stringify(MS));
    localStorage.setItem('tw2-ci',JSON.stringify(CI));
    localStorage.setItem('tw2-cm',JSON.stringify(CM));
  }catch(e){}
}

// ── LEVELS ────────────────────────────────────────────────
const XL=[0,200,500,1000,2000,3500,5500,8000,11000,15000];
const LT=['🌱 Novato Aventureiro','⚔️ Guerreiro Iniciante','🛡 Escudeiro Bravo','🗡️ Cavaleiro Corajoso','👑 Herói do Reino','🔱 Lendário','🌟 Mestre Supremo','💎 Campeão','🦅 Guardião','🔥 Lenda Imortal'];
function lv(){let l=1;for(let i=1;i<XL.length;i++){if(P.xp>=XL[i])l=i+1;else break;}return l;}
function lt(l){return LT[Math.min(l-1,LT.length-1)];}
function xpPct(){const l=lv();const c=XL[Math.min(l-1,XL.length-1)];const n=XL[Math.min(l,XL.length-1)];return n>c?((P.xp-c)/(n-c)*100):100;}
function nxp(){return XL[Math.min(lv(),XL.length-1)];}

// ── SVG ───────────────────────────────────────────────────
const VB='viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg"';

function layerDiv(svgStr,w,h){
  const d=document.createElement('div');
  d.style.cssText=`position:absolute;top:0;left:0;width:${w}px;height:${h}px;`;
  d.innerHTML=svgStr.replace('<svg ','`<svg width="${w}" height="${h}" `'.replace('`',''));
  // fix: directly set width/height
  const sv=d.querySelector('svg');
  if(sv){sv.setAttribute('width',w);sv.setAttribute('height',h);}
  return d;
}

function renderChar(container,w,h){
  container.innerHTML='';
  container.style.width=w+'px';
  container.style.height=h+'px';
  const G=id=>CAT.find(x=>x.id===id)||CI.find(x=>x.id===id);
  const sh=P.slots.shirt  ?G(P.slots.shirt):null;
  const jk=P.slots.jacket ?G(P.slots.jacket):null;
  const pa=P.slots.pants  ?G(P.slots.pants):null;
  const so=P.slots.shoes  ?G(P.slots.shoes):null;
  const hd=P.slots.head   ?G(P.slots.head):null;
  const h2=P.slots.head2  ?G(P.slots.head2):null;
  const wp=P.slots.weapon ?G(P.slots.weapon):null;
  const sc=P.slots.shield ?G(P.slots.shield):null;
  const pt=P.slots.pet    ?G(P.slots.pet):null;
  const bk=P.slots.back   ?G(P.slots.back):null;
  const add=s=>container.appendChild(layerDiv(s,w,h));
  if(bk&&bk.ep) add(ES(bk.e,bk.ep[0],bk.ep[1],bk.ep[2]));
  if(jk&&jk.t==='cape') add(SVGS['cape-b']);
  add(BASE);
  if(sh&&!jk) add(SVGS.shirt(sh.c));
  if(jk){
    if(jk.t==='cape') add(SVGS['cape-f']);
    else if(jk.t==='armor') add(SVGS.armor);
    else add(SVGS.jacket(jk.c));
  }
  if(pa) add(SVGS.pants(pa.c));
  if(so) add(so.t==='boots'?SVGS.boots:SVGS.shoes(so.c));
  if(sc&&SVGS[sc.t]) add(SVGS[sc.t]);
  if(wp){if(SVGS[wp.t])add(SVGS[wp.t]);else if(wp.ep)add(ES(wp.e,wp.ep[0],wp.ep[1],wp.ep[2]));}
  if(hd){if(SVGS[hd.t])add(SVGS[hd.t]);else if(hd.ep)add(ES(hd.e,hd.ep[0],hd.ep[1],hd.ep[2]));}
  if(h2&&h2.ep) add(ES(h2.e,h2.ep[0],h2.ep[1],h2.ep[2]));
  if(pt){if(SVGS[pt.t])add(SVGS[pt.t]);else if(pt.ep)add(ES(pt.e,pt.ep[0],pt.ep[1],pt.ep[2]));}
  CI.filter(i=>P.owned.includes(i.id)).forEach((it,idx)=>{
    const ps=[[488,488,36],[192,420,32],[488,420,32]];
    const p2=ps[idx%ps.length];
    add(ES(it.e||'🎁',p2[0],p2[1],p2[2]));
  });
}

function upd(){
  const l=lv();
  document.querySelectorAll('.cd').forEach(el=>el.textContent=P.coins);
  document.getElementById('hlvl').textContent=`Nível ${l} — ${lt(l).split(' ').slice(1).join(' ')}`;
  document.getElementById('hxp').textContent=`${P.xp}/${nxp()} XP`;
  document.getElementById('hbar').style.width=xpPct()+'%';
  document.getElementById('hbadge').textContent=lt(l);
  document.getElementById('slv').textContent=l;
  document.getElementById('sms').textContent=P.done;
  document.getElementById('sit').textContent=P.owned.length;
  renderChar(document.getElementById('char-wrap'),190,255);
}

  {id:'missions',lbl:'Missões', path:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'},
  {id:'shop',    lbl:'Loja',    path:'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0'},
  {id:'parents', lbl:'Pais',    path:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'},

function mkNav(navId, activeId){
  const el=document.getElementById(navId);
  if(!el)return;
  el.innerHTML=NTABS.map(t=>`<button class="nb ${t.id===activeId?'on':''}" onclick="goTo('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.path}"/></svg><span>${t.lbl}</span></button>`).join('');
}

function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  document.querySelectorAll('.nb').forEach(b=>{
    b.classList.remove('on');
    if(b.getAttribute('onclick')===`goTo('${id}')`) b.classList.add('on');
  });
  if(id==='missions') renderMissions();
  else if(id==='shop') renderShop();
  else if(id==='parents') renderParents();
  else upd();
}

// ── MISSIONS ──────────────────────────────────────────────
function renderMissions(){
  const all=[...MS,...CM];
  const el=document.getElementById('mlist');
  if(!el){console.error('mlist not found');return;}
  if(all.length===0){
    el.innerHTML='<div style="color:#7a5a9a;padding:20px;text-align:center;">Nenhuma missão disponível.</div>';
    return;
  }
  el.innerHTML=all.map(m=>{
    const done=m.st==='done'||m.st==='approved';
    const pend=m.st==='pend'||m.st==='pending';
    const pill=done?`<span class="pill ok">✓ Feito</span>`:pend?`<span class="pill wt">⏳ Aguardando</span>`:'';
    const tag=m.tag||'purple';
    return `<div class="mc ${done?'done':''} ${pend?'pend':''}" onclick="markM('${m.id}')">
      <div class="mi c-${tag}">${m.e||m.emoji||'⭐'}</div>
      <div style="flex:1;min-width:0;">
        <div class="mt">${m.title}</div>
        <div class="md">${m.desc||m.description||''}</div>
      </div>
      <div class="mr">
        <span class="pill pg">+${m.xp||m.xpReward||0} XP</span>
        ${pill}
      </div>
    </div>`;
  }).join('');
}

function markM(id){
  const all=[...MS,...CM];
  const m=all.find(x=>x.id===id);
  if(!m||m.st==='done'||m.st==='pend'||m.st==='approved'||m.st==='pending') return;
  m.st='pend';
  P.pending.push(`${id}|${m.title}|${m.xp||m.xpReward||0}|${m.c||m.coinReward||0}`);
  save(); renderMissions(); upd();
  const el=document.querySelector(`[onclick="markM('${id}')"]`);
  if(el) burst(el,m.xp||30,m.title);
}

function burst(refEl,xpv,name){
  const app=document.getElementById('app');
  const ar=app.getBoundingClientRect();
  const rr=refEl?refEl.getBoundingClientRect():{left:180,top:300,width:0,height:0};
  const cx=rr.left-ar.left+rr.width/2, cy=rr.top-ar.top+rr.height/2;
  const sy=['⭐','✨','🪙','💫','🎉','⚡','🌟'];
  for(let i=0;i<18;i++){
    const a=(i/18)*Math.PI*2+Math.random()*.4,d=50+Math.random()*100;
    const p=document.createElement('div');p.className='bp';
    p.textContent=sy[i%sy.length];const z=13+Math.random()*11;
    p.style.cssText=`left:${cx}px;top:${cy}px;--sz:${z}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--dur:${.7+Math.random()*.5}s;animation-delay:${Math.random()*.1}s;`;
    app.appendChild(p);setTimeout(()=>p.remove(),1500);
  }
  const ban=document.createElement('div');ban.className='cban';
  ban.textContent=`🎯 +${xpv} XP — ${name}!`;
  ban.style.top=Math.max(55,cy-55)+'px';
  app.appendChild(ban);setTimeout(()=>ban.remove(),2600);
}

// ── SHOP ──────────────────────────────────────────────────
function renderShop(){
  const all=[...CAT,...CI];
  const cats={};
  all.forEach(it=>{const c=it.cat||'Especiais';if(!cats[c])cats[c]=[];cats[c].push(it);});
  let html='';
  for(const [sec,items] of Object.entries(cats)){
    html+=`<div class="sst">${sec}</div><div class="sgrid">`;
    items.forEach(it=>{
      const owned=P.owned.includes(it.id);
      const eq=P.slots[it.slot||'x']===it.id;
      const can=P.coins>=it.price;
      const tag=owned?`<span class="stg to">${eq?'✓ Equipado':'✓ Possuído'}</span>`
                     :`<span class="stg ${can?'tp':'tb'}">🪙${it.price}</span>`;
      html+=`<div class="si ${owned?'own':''}" onclick="buyIt('${it.id}')">
        <div class="ie">${it.e||it.emoji}</div>
        <div class="in">${it.name}</div>
        ${tag}
      </div>`;
    });
    html+='</div>';
  }
  document.getElementById('shopbody').innerHTML=html;
}

function buyIt(id){
  const it=CAT.find(x=>x.id===id)||CI.find(x=>x.id===id);
  if(!it||P.owned.includes(id))return;
  if(P.coins<it.price){
    const el=document.querySelector(`[onclick="buyIt('${id}')"]`);
    if(el){el.style.animation='shake .4s ease';setTimeout(()=>el.style.animation='',500);}
    toast(`Faltam 🪙${it.price-P.coins}!`,'#f87171','#2a0808');return;
  }
  P.coins-=it.price;P.owned.push(id);P.slots[it.slot||'x']=id;
  save();renderShop();upd();showEq(it);
}

// ── EQUIP MODAL ───────────────────────────────────────────
let _di;
function showEq(it){
  const modal=document.getElementById('eq-modal');
  const ec=document.getElementById('eq-char');
  ec.querySelectorAll('div').forEach(d=>d.remove());
  renderChar(ec,160,213);
  const ee=document.getElementById('eq-emoji');
  ee.textContent=it.e||it.emoji;
  ee.style.cssText='position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;z-index:10;';
  document.getElementById('eqtxt').style.opacity='0';
  document.getElementById('eqsub').style.opacity='0';
  document.getElementById('eqbtn').style.opacity='0';
  document.getElementById('eqtxt').textContent=`${it.name} equipada! ✨`;
  document.getElementById('eqsub').textContent=`-${it.price} 🪙`;
  modal.style.animation='min .3s ease-out';
  modal.classList.add('show');
  let ph=0;clearInterval(_di);
  _di=setInterval(()=>{ph+=.12;const y=-14*Math.abs(Math.sin(ph));const r=5*Math.sin(ph);const sx=1-.05*Math.abs(Math.sin(ph));ec.style.transform=`translateY(${y}px) rotate(${r}deg) scaleX(${sx})`;},30);
  setTimeout(()=>{ee.style.animation='spinin .85s cubic-bezier(.34,1.56,.64,1) forwards';ee.style.opacity='1';},300);
  setTimeout(()=>{document.getElementById('eqtxt').style.cssText='color:#fbbf24;font-size:16px;font-weight:700;opacity:1;transition:opacity .5s;';},1300);
  setTimeout(()=>{document.getElementById('eqsub').style.cssText='color:#c084fc;font-size:12px;opacity:1;transition:opacity .4s;';},1700);
  setTimeout(()=>{
    document.getElementById('eqbtn').style.cssText='background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:1;transition:opacity .4s;';
    const app=document.getElementById('app');burst2(app,160,280);burst2(app,240,260);
  },2000);
  setTimeout(()=>closeEq(),6000);
}
function burst2(container,cx,cy){
  const sy=['⭐','✨','🪙','💫','🎉'];
  for(let i=0;i<16;i++){
    const a=(i/16)*Math.PI*2,d=50+Math.random()*90;
    const p=document.createElement('div');p.className='bp';
    p.textContent=sy[i%sy.length];const z=12+Math.random()*10;
    p.style.cssText=`left:${cx}px;top:${cy}px;--sz:${z}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--dur:${.7+Math.random()*.4}s;`;
    container.appendChild(p);setTimeout(()=>p.remove(),1400);
  }
}
function closeEq(){clearInterval(_di);const m=document.getElementById('eq-modal');m.classList.remove('show');document.getElementById('eq-char').style.transform='';}

// ── PARENTS ───────────────────────────────────────────────
let _pu=false,_pp='';
function renderParents(){
  document.getElementById('lkbtn').style.display=_pu?'block':'none';
  const el=document.getElementById('pbody');
  if(!_pu){
    el.innerHTML=`<div class="pin-area">
      <div style="font-size:38px;color:#7c3aed;">🔒</div>
      <div style="color:#c084fc;font-size:15px;font-weight:600;">PIN dos pais</div>
      <div class="pdots">${[0,1,2,3].map(i=>`<div class="pd ${i<_pp.length?'on':''}"></div>`).join('')}</div>
      <div style="color:#7a5a9a;font-size:11px;">PIN: ${P.pin}</div>
      <div class="pgrid">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✗'].map(k=>`<div class="pk" onclick="pk('${k}')">${k}</div>`).join('')}</div>
    </div>`;
    return;
  }
  const pend=P.pending.length?P.pending.map(p=>{
    const pts=p.split('|');
    return `<div class="ac"><div style="color:#e2d0f8;font-size:13px;font-weight:500;">${pts[1]||p}</div>
    <div style="color:#7a5a9a;font-size:11px;">Thomas marcou como concluída</div>
    <div style="display:flex;gap:8px;margin-top:4px;"><button class="bgr" onclick="appr('${p}')">✓ Aprovar (+${pts[2]||0} XP)</button><button class="brd" onclick="rej('${p}')">✗ Rejeitar</button></div></div>`;
  }).join(''):`<div style="color:#7a5a9a;font-size:12px;margin-bottom:4px;">Nenhuma aprovação pendente.</div>`;
  const ciHTML=CI.length?CI.map(it=>`<div class="crow"><span>${it.e||'🎁'} ${it.name}</span><span style="color:#fbbf24;font-size:11px;">🪙${it.price}</span><span onclick="delCI('${it.id}')" style="cursor:pointer;font-size:16px;">🗑️</span></div>`).join(''):`<div style="color:#7a5a9a;font-size:12px;">Nenhum item.</div>`;
  const cmHTML=CM.length?CM.map(m=>`<div class="crow"><span>⭐ ${m.title}</span><span style="color:#a78bcc;font-size:11px;">+${m.xp||0}XP</span><span onclick="delCM('${m.id}')" style="cursor:pointer;font-size:16px;">🗑️</span></div>`).join(''):`<div style="color:#7a5a9a;font-size:12px;">Nenhuma missão.</div>`;
  el.innerHTML=`
    <div class="slbl">Aprovações</div>${pend}
    <div class="slbl" style="margin-top:8px;">➕ Novo Item</div>
    <div class="cd">
      <input id="fi-n" class="di" placeholder="Nome do item"/><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="fi-e" class="di" placeholder="Emoji 🎁" maxlength="4"/><input id="fi-p" class="di" type="number" placeholder="Preço 🪙"/></div>
      <select id="fi-c" class="ds">${['Roupas','Chapéus','Armas','Escudos','Pets','Especiais'].map(c=>`<option>${c}</option>`).join('')}</select>
      <button class="bpu" onclick="addCI()">Adicionar à Loja</button>
    </div>
    <div class="slbl" style="margin-top:8px;">Itens dos pais</div>${ciHTML}
    <div class="slbl" style="margin-top:8px;">📋 Nova Missão</div>
    <div class="cd">
      <input id="mi-t" class="di" placeholder="Nome da missão"/><input id="mi-d" class="di" placeholder="Descrição (opcional)"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="mi-x" class="di" type="number" placeholder="XP"/><input id="mi-c" class="di" type="number" placeholder="Moedas 🪙"/></div>
      <button class="bpu" onclick="addCM()">Adicionar Missão</button>
    </div>
    <div class="slbl" style="margin-top:8px;">Missões dos pais</div>${cmHTML}
    <div class="slbl" style="margin-top:8px;">Backup & Controles</div>
    <div class="cd">
      <div class="mrow" onclick="expBk()"><span style="font-size:18px;">💾</span><span>Exportar backup (.json)</span></div>
      <div class="mrow" onclick="impBk()"><span style="font-size:18px;">📂</span><span>Restaurar backup</span></div>
      <div class="mrow" onclick="rstMs()"><span style="font-size:18px;">🔄</span><span>Resetar missões do dia</span></div>
    </div>
    <div style="height:20px;"></div>`;
}
function pk(k){
  if(k==='⌫'){_pp=_pp.slice(0,-1);renderParents();return;}
  if(k==='✗'){_pp='';renderParents();return;}
  if(_pp.length>=4)return;
  _pp+=k;renderParents();
  if(_pp.length===4){setTimeout(()=>{
    if(_pp===P.pin){_pu=true;_pp='';renderParents();}
    else{_pp='';toast('PIN incorreto!','#f87171','#2a0808');renderParents();}
  },200);}
}
function lockP(){_pu=false;_pp='';renderParents();}
function appr(key){const p=key.split('|');P.xp+=parseInt(p[2])||0;P.coins+=parseInt(p[3])||0;P.done++;P.pending=P.pending.filter(x=>x!==key);const m=[...MS,...CM].find(x=>x.id===p[0]);if(m)m.st='done';save();upd();renderParents();}
function rej(key){const p=key.split('|');P.pending=P.pending.filter(x=>x!==key);const m=[...MS,...CM].find(x=>x.id===p[0]);if(m)m.st='ok';save();renderParents();}
function addCI(){const n=document.getElementById('fi-n').value.trim();if(!n)return toast('Nome obrigatório!','#f87171','#2a0808');const e=document.getElementById('fi-e').value.trim()||'🎁';const p=parseInt(document.getElementById('fi-p').value)||100;const c=document.getElementById('fi-c').value;CI.push({id:'ci'+Date.now(),name:n,e,emoji:e,price:p,cat:c,slot:'cx'+CI.length});save();renderParents();renderShop();toast(`"${n}" adicionado!`,'#34d399','#0a2a10');}
function delCI(id){CI=CI.filter(x=>x.id!==id);save();renderParents();renderShop();}
function addCM(){const t=document.getElementById('mi-t').value.trim();if(!t)return toast('Nome obrigatório!','#f87171','#2a0808');const d=document.getElementById('mi-d').value.trim()||'Missão especial';const x=parseInt(document.getElementById('mi-x').value)||30;const c=parseInt(document.getElementById('mi-c').value)||15;CM.push({id:'cm'+Date.now(),title:t,desc:d,xp:x,c,e:'⭐',tag:'purple',st:'ok'});save();renderParents();renderMissions();toast(`"${t}" adicionada!`,'#34d399','#0a2a10');}
function delCM(id){CM=CM.filter(x=>x.id!==id);save();renderParents();}
function rstMs(){MS.forEach(m=>m.st='ok');CM.forEach(m=>m.st='ok');P.pending=[];save();renderParents();renderMissions();toast('Missões resetadas! 🔄','#c084fc','#2a1040');}
function expBk(){const b=new Blob([JSON.stringify({v:2,P,MS,CI,CM})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='thomasworld.json';a.click();toast('Backup exportado! 💾','#34d399','#0a2a10');}
function impBk(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.P)P=d.P;if(d.MS){MS=DMISSIONS.map(dm=>{const s=d.MS.find(x=>x.id===dm.id);return{...dm,st:s?s.st:'ok'};});}if(d.CI)CI=d.CI;if(d.CM)CM=d.CM;save();upd();renderParents();toast('Backup restaurado!','#34d399','#0a2a10');}catch(err){toast('Erro no backup!','#f87171','#2a0808');}};r.readAsText(f);};i.click();}

// ── TOAST ─────────────────────────────────────────────────
let _tt;
function toast(msg,col,bg='#1a0a2e'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.cssText=`position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;border:1px solid ${col};color:${col};background:${bg};display:block;`;
  clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',2400);
}

// ── BACKGROUND ────────────────────────────────────────────
const cv=document.getElementById('bgc'),ctx=cv.getContext('2d');
let stars=[],bt=0;
function mkBg(){const a=document.getElementById('app');cv.width=a.offsetWidth;cv.height=a.offsetHeight;stars=Array.from({length:40},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*2.4,ph:Math.random(),sp:.4+Math.random()}));}
function drawBg(){
  const w=cv.width,h=cv.height;ctx.clearRect(0,0,w,h);
  [[.15,.05,.35,.28,'#7c3aed'],[.55,.55,.28,.22,'#9333ea'],[.7,.15,.2,.18,'#c084fc']].forEach(([ox,oy,rw,rh,col])=>{const gx=ox*w+18*Math.sin(bt*.3),gy=oy*h+13*Math.cos(bt*.25);const gr=ctx.createRadialGradient(gx,gy,0,gx,gy,rw*w*.7);gr.addColorStop(0,col+'22');gr.addColorStop(1,'transparent');ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(gx,gy,rw*w/2,rh*h/2,0,0,Math.PI*2);ctx.fill();});
  stars.forEach(s=>{const op=.12+.7*(.5+.5*Math.sin((bt*s.sp+s.ph)*Math.PI*2));ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${op})`;ctx.fill();});
  bt+=.008;requestAnimationFrame(drawBg);
}

// ── INIT ──────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  load();
  mkBg();drawBg();
  [0,1,2,3].forEach(i=>mkNav('nav'+i,['home','missions','shop','parents'][i]));
  upd();
  renderMissions();
  window.addEventListener('resize',mkBg);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
</script>
