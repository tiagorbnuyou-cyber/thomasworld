<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<meta name="theme-color" content="#7c3aed"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Thomas's World</title>
<link rel="manifest" href="manifest.json"/>
<link rel="icon" href="icon.svg"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{background:#1a0a2e;color:#e2d0f8;display:flex;flex-direction:column;align-items:center;justify-content:center;}
#app{width:100%;max-width:420px;height:100vh;max-height:900px;background:#1a0a2e;position:relative;overflow:hidden;display:flex;flex-direction:column;}
canvas#bgCanvas{position:absolute;inset:0;pointer-events:none;z-index:0;}

/* SCREENS */
.screen{display:none;flex-direction:column;flex:1;position:relative;z-index:1;overflow:hidden;}
.screen.active{display:flex;}

/* HEADER */
.hdr{background:rgba(18,6,42,.85);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{color:#c084fc;font-size:15px;font-weight:600;}
.coin-badge{display:flex;align-items:center;gap:5px;background:#2a1040;border-radius:20px;padding:4px 10px;color:#fbbf24;font-size:13px;font-weight:600;}

/* XP BAR */
.xp-wrap{background:rgba(18,6,42,.85);padding:0 16px 10px;flex-shrink:0;}
.xp-row{display:flex;justify-content:space-between;font-size:11px;color:#a78bcc;margin-bottom:4px;}
.xp-track{background:#2a1040;border-radius:10px;height:8px;overflow:hidden;}
.xp-fill{background:#9333ea;height:100%;border-radius:10px;transition:width .8s ease;}

/* NAV */
.nav{display:flex;background:#12062a;border-top:1px solid #3a1a5e;flex-shrink:0;position:relative;z-index:2;}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;background:none;border:none;cursor:pointer;color:#7a5a9a;font-size:9px;font-family:inherit;}
.nav-btn svg{width:22px;height:22px;}
.nav-btn.active{color:#c084fc;}

/* HOME */
.home-scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 16px 0;}
.lvl-badge{background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:3px 16px;border-radius:20px;margin-bottom:6px;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-top:10px;padding-bottom:16px;}
.stat-card{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:10px;text-align:center;}
.stat-val{color:#c084fc;font-size:20px;font-weight:600;}
.stat-lbl{color:#7a5a9a;font-size:10px;margin-top:2px;}

/* CHARACTER */
#char-container{position:relative;width:190px;height:255px;}
#char-container svg{position:absolute;top:0;left:0;width:190px;height:255px;}

/* MISSIONS */
.list-scroll{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.m-card{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .12s,border-color .2s;-webkit-user-select:none;user-select:none;}
.m-card:active{transform:scale(.97);}
.m-card.done{opacity:.5;}
.m-card.pending{border-color:#fbbf24;}
.m-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.mi-teal{background:#002a1a;} .mi-amber{background:#2a1a00;} .mi-purple{background:#2e1060;} .mi-pink{background:#2a001a;}
.m-info{flex:1;min-width:0;}
.m-title{color:#e2d0f8;font-size:13px;font-weight:500;}
.m-desc{color:#7a5a9a;font-size:11px;margin-top:2px;}
.m-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.pill{border-radius:20px;padding:2px 8px;font-size:10px;display:inline-block;}
.pill-gold{background:#2a1040;color:#fbbf24;}
.pill-green{background:#0a2a10;color:#34d399;}
.pill-warn{background:#2a1a00;color:#fbbf24;}
.pill-red{background:#2a0a10;color:#f87171;}

/* SHOP */
.shop-scroll{flex:1;overflow-y:auto;padding:10px 13px;}
.shop-sec-title{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 6px;}
.shop-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.s-card{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;transition:transform .12s,border-color .2s;}
.s-card:active{transform:scale(.94);}
.s-card.owned{border-color:#34d399;}
.s-card .s-icon{font-size:24px;margin-bottom:4px;}
.s-card .s-name{color:#e2d0f8;font-size:10px;font-weight:500;line-height:1.2;min-height:28px;display:flex;align-items:center;justify-content:center;}
.s-tag{margin-top:4px;border-radius:20px;padding:2px 6px;font-size:10px;display:inline-block;}
.s-tag-price{background:#2a1040;color:#fbbf24;}
.s-tag-own{background:#0a2a10;color:#34d399;}
.s-tag-broke{background:#2a0808;color:#f87171;}

/* PARENTS */
.p-scroll{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.pin-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0;}
.pin-dots{display:flex;gap:12px;}
.pin-dot{width:14px;height:14px;border-radius:50%;background:#3a1a5e;border:1.5px solid #7c3aed;transition:background .2s;}
.pin-dot.on{background:#c084fc;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px;}
.pin-key{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:14px 0;text-align:center;font-size:20px;color:#e2d0f8;cursor:pointer;font-weight:500;}
.pin-key:active{background:#2a1040;}
.sec-lbl{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 6px;}
.card-dark{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:14px;}
.dark-input{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none;}
.dark-input:focus{border-color:#7c3aed;}
.dark-select{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;-webkit-appearance:none;}
.btn-purple{background:#7c3aed;border:none;border-radius:10px;color:#fff;padding:10px;font-size:13px;font-family:inherit;cursor:pointer;width:100%;}
.btn-purple:active{opacity:.85;}
.btn-green{background:#0a2a10;border:1px solid #34d399;border-radius:8px;color:#34d399;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.btn-red2{background:#2a0a10;border:1px solid #f87171;border-radius:8px;color:#f87171;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.appr-card{background:#12062a;border:1.5px solid #fbbf24;border-radius:12px;padding:12px;}
.appr-title{color:#e2d0f8;font-size:13px;font-weight:500;margin-bottom:3px;}
.appr-sub{color:#7a5a9a;font-size:11px;margin-bottom:8px;}
.appr-btns{display:flex;gap:8px;}
.menu-row{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #3a1a5e;}
.menu-row:last-child{border-bottom:none;}
.custom-row{display:flex;align-items:center;gap:8px;background:#0d0620;border-radius:8px;padding:7px 10px;margin-bottom:6px;}
.custom-row span{color:#e2d0f8;font-size:12px;flex:1;}

/* EQUIP MODAL */
#equip-modal{position:absolute;inset:0;background:rgba(8,2,20,.95);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:0;}
#equip-modal.show{display:flex;}
.eq-char{position:relative;width:160px;height:213px;}
.eq-char svg{position:absolute;top:0;left:0;width:160px;height:213px;}
#eq-item-emoji{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;transition:none;}
.eq-name{color:#fbbf24;font-size:16px;font-weight:700;opacity:0;transform:translateY(14px);transition:opacity .5s,transform .5s;}
.eq-cost{color:#c084fc;font-size:12px;opacity:0;transform:translateY(10px);transition:opacity .4s,transform .4s;}
.eq-btn{background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:0;transition:opacity .4s;}

/* BURST PARTICLES */
.burst-p{position:absolute;pointer-events:none;z-index:50;font-size:var(--sz);animation:burst var(--dur) ease-out forwards;}
.cel-banner{position:absolute;left:50%;background:#7c3aed;color:#fff;padding:8px 18px;border-radius:24px;font-size:12px;font-weight:600;pointer-events:none;z-index:60;white-space:nowrap;animation:banner-pop 2.5s ease-out forwards;}

/* TOAST */
#toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;display:none;}

@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2);opacity:0;}}
@keyframes banner-pop{0%{opacity:0;transform:translateX(-50%) scale(.6);}15%{opacity:1;transform:translateX(-50%) scale(1.08);}25%{transform:translateX(-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(.8) translateY(-16px);}}
@keyframes silly-dance{0%{transform:translateY(0) rotate(-2deg) scaleX(1);}12%{transform:translateY(-15px) rotate(5deg) scaleX(.93);}25%{transform:translateY(-4px) rotate(-5deg) scaleX(1.06);}37%{transform:translateY(-18px) rotate(4deg) scaleX(.92);}50%{transform:translateY(-5px) rotate(-5deg) scaleX(1.05);}62%{transform:translateY(-17px) rotate(5deg) scaleX(.92);}75%{transform:translateY(-2px) rotate(-4deg) scaleX(1.05);}87%{transform:translateY(-13px) rotate(4deg) scaleX(.94);}100%{transform:translateY(0) rotate(0deg) scaleX(1);}}
@keyframes spin-in{0%{transform:translateX(-50%) translateY(-70px) rotate(540deg) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(8px) rotate(-20deg) scale(1.5);opacity:1;}70%{transform:translateX(-50%) translateY(-6px) rotate(10deg) scale(.85);}82%{transform:translateX(-50%) translateY(4px) rotate(-5deg) scale(1.1);}100%{transform:translateX(-50%) translateY(0) rotate(0) scale(1);opacity:1;}}
@keyframes modal-in{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
</style>
</head>

const XP_LVL  = [0,200,500,1000,2000,3500,5500,8000,11000,15000];
const LV_TITLES = ['🌱 Novato Aventureiro','⚔️ Guerreiro Iniciante','🛡 Escudeiro Bravo','🗡️ Cavaleiro Corajoso','👑 Herói do Reino','🔱 Lendário','🌟 Mestre Supremo','💎 Campeão Eterno','🦅 Guardião Supremo','🔥 Lenda Imortal'];

let P = { coins:500, xp:0, done:0, owned:[], slots:{}, pin:'1234', pending:[] };
let MISSIONS = DEFAULT_MISSIONS.map(m=>({...m, status:'available'}));
let CITEMS = [];
let CMISSIONS = [];

function loadState() {
  try {
    const p = localStorage.getItem('tw-player');   if(p) P = JSON.parse(p);
    const m = localStorage.getItem('tw-missions'); if(m) MISSIONS = JSON.parse(m);
    const ci= localStorage.getItem('tw-citems');   if(ci) CITEMS = JSON.parse(ci);
    const cm= localStorage.getItem('tw-cmissions');if(cm) CMISSIONS = JSON.parse(cm);
  } catch(e) {}
}
function saveState() {
  try {
    localStorage.setItem('tw-player',   JSON.stringify(P));
    localStorage.setItem('tw-missions', JSON.stringify(MISSIONS));
    localStorage.setItem('tw-citems',   JSON.stringify(CITEMS));
    localStorage.setItem('tw-cmissions',JSON.stringify(CMISSIONS));
  } catch(e) {}
}

function getLevel() {
  let lv=1;
  for(let i=1;i<XP_LVL.length;i++){if(P.xp>=XP_LVL[i])lv=i+1;else break;}
  return lv;
}
function getLvTitle(lv){ return LV_TITLES[Math.min(lv-1,LV_TITLES.length-1)]; }
function getXpPct() {
  const lv=getLevel();
  const cur=XP_LVL[Math.min(lv-1,XP_LVL.length-1)];
  const nxt=XP_LVL[Math.min(lv,XP_LVL.length-1)];
  return nxt>cur?((P.xp-cur)/(nxt-cur)*100).toFixed(1):100;
}
function getNextXp() { const lv=getLevel(); return XP_LVL[Math.min(lv,XP_LVL.length-1)]; }

// RENDER CHARACTER
// ══════════════════════════════════════════════════════════
function buildCharSVG(w,h) {
  const s = P.slots;
  const G = id => CATALOG.find(x=>x.id===id) || CITEMS.find(x=>x.id===id);
  const shirt  = s.shirt  ? G(s.shirt)  : null;
  const jacket = s.jacket ? G(s.jacket) : null;
  const pants  = s.pants  ? G(s.pants)  : null;
  const shoes  = s.shoes  ? G(s.shoes)  : null;
  const head   = s.head   ? G(s.head)   : null;
  const head2  = s.head2  ? G(s.head2)  : null;
  const weapon = s.weapon ? G(s.weapon) : null;
  const shield = s.shield ? G(s.shield) : null;
  const pet    = s.pet    ? G(s.pet)    : null;
  const back   = s.back   ? G(s.back)   : null;

  const layers = [];
  // Behind
  if(back && back.ep) layers.push(emojiSvg(back.e,back.ep[0],back.ep[1],back.ep[2]));
  if(jacket && jacket.t==='cape') layers.push(SVG.capeBhd);
  // Base
  layers.push(SVG.base);
  // Shirt
  if(shirt && !jacket) layers.push(SVG.shirt(shirt.c));
  // Jacket
  if(jacket) {
    if(jacket.t==='cape')   layers.push(SVG.capeFnt);
    else if(jacket.t==='armor') layers.push(SVG.armor);
    else layers.push(SVG.jacket(jacket.c));
  }
  // Pants
  if(pants) layers.push(SVG.pants(pants.c));
  // Shoes
  if(shoes) layers.push(shoes.t==='boots' ? SVG.boots : SVG.shoes(shoes.c));
  // Shield
  if(shield) {
    const m = {['sh-wood']:SVG.shWood,['sh-iron']:SVG.shIron,['sh-magic']:SVG.shMagic};
    if(m[shield.t]) layers.push(m[shield.t]);
  }
  // Weapon
  if(weapon) {
    const m = {['sw-wood']:SVG.swWood,['sw-iron']:SVG.swIron,['sw-leg']:SVG.swLeg};
    if(m[weapon.t]) layers.push(m[weapon.t]);
    else if(weapon.ep) layers.push(emojiSvg(weapon.e,weapon.ep[0],weapon.ep[1],weapon.ep[2]));
  }
  // Head
  if(head) {
    const m = {['crown-g']:SVG.crownG,['crown-s']:SVG.crownS};
    if(m[head.t]) layers.push(m[head.t]);
    else if(head.ep) layers.push(emojiSvg(head.e,head.ep[0],head.ep[1],head.ep[2]));
  }
  // Head2
  if(head2 && head2.ep) layers.push(emojiSvg(head2.e,head2.ep[0],head2.ep[1],head2.ep[2]));
  // Pet
  if(pet) {
    if(pet.t==='fox') layers.push(SVG.fox);
    else if(pet.t==='dragon') layers.push(SVG.dragon);
    else if(pet.ep) layers.push(emojiSvg(pet.e,pet.ep[0],pet.ep[1],pet.ep[2]));
  }
  // Custom items (emoji near char)
  const custPos=[[488,488,36],[192,420,32],[488,420,32]];
  CITEMS.filter(i=>P.owned.includes(i.id)).forEach((it,idx)=>{
    const p=custPos[idx%custPos.length];
    layers.push(emojiSvg(it.e||it.emoji,p[0],p[1],p[2]));
  });

  // Wrap each layer as an absolutely-positioned div
  return layers.map(svgStr => {
    const div = document.createElement('div');
    div.style.cssText = `position:absolute;top:0;left:0;width:${w}px;height:${h}px;`;
    div.innerHTML = svgStr.replace(/<svg /,`<svg width="${w}" height="${h}" `);
    return div;
  });
}

function renderChar(container, w=190, h=255) {
  container.innerHTML = '';
  container.style.width = w+'px';
  container.style.height = h+'px';
  buildCharSVG(w,h).forEach(el => container.appendChild(el));
}

function updateAll() {
  const lv = getLevel();
  document.querySelectorAll('.coin-d').forEach(el=>el.textContent=P.coins);
  document.getElementById('h-lv-lbl').textContent = `Nível ${lv} — ${getLvTitle(lv).split(' ').slice(1).join(' ')}`;
  document.getElementById('h-xp-lbl').textContent = `${P.xp} / ${getNextXp()} XP`;
  document.getElementById('h-xp-fill').style.width = getXpPct()+'%';
  document.getElementById('h-badge').textContent = getLvTitle(lv);
  document.getElementById('s-level').textContent = lv;
  document.getElementById('s-missions').textContent = P.done;
  document.getElementById('s-items').textContent = P.owned.length;
  renderChar(document.getElementById('char-container'));
}

  {id:'parents',  label:'Pais',    icon:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'},
];

function buildNav(containerId, activeId) {
  const nav = document.getElementById(containerId);
  if (!nav) return;
  nav.innerHTML = NAV_ITEMS.map(n => `
    <button class="nav-btn ${n.id===activeId?'active':''}" onclick="goTo('${n.id}')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${n.icon}"/></svg>
      <span>${n.label}</span>
    </button>
  `).join('');
}

function goTo(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  if(id==='missions') renderMissions();
  if(id==='shop') renderShop();
  if(id==='parents') renderParents();
  if(id==='home') updateAll();
}

// ══════════════════════════════════════════════════════════
// MISSIONS
// ══════════════════════════════════════════════════════════
function renderMissions() {
  const all = [...MISSIONS, ...CMISSIONS];
  const el = document.getElementById('mission-list');
  el.innerHTML = all.map(m => {
    const done    = m.status==='approved';
    const pending = m.status==='pending';
    const tagCls  = `mi-${m.tag||'purple'}`;
    const pill    = done ? `<span class="pill pill-green">✓ Feito</span>`
                  : pending ? `<span class="pill pill-warn">⏳ Aguardando</span>`
                  : '';
    return `<div class="m-card ${done?'done':''} ${pending?'pending':''}" onclick="markMission('${m.id}')">
      <div class="m-icon ${tagCls}">${m.e||m.emoji||'⭐'}</div>
      <div class="m-info">
        <div class="m-title">${m.title}</div>
        <div class="m-desc">${m.desc||m.description||''}</div>
      </div>
      <div class="m-right">
        <span class="pill pill-gold">+${m.xp||m.xpReward} XP</span>
        ${pill}
      </div>
    </div>`;
  }).join('');
}

function markMission(id) {
  const all = [...MISSIONS, ...CMISSIONS];
  const m = all.find(x=>x.id===id);
  if(!m || m.status!=='available') return;
  m.status = 'pending';
  P.pending.push(`${id}|${m.title}|${m.xp||m.xpReward||0}|${m.c||m.coinReward||0}`);
  saveState();
  renderMissions();
  fireCelebration(document.querySelector(`.m-card`), m.xp||m.xpReward, m.title);
}

// ══════════════════════════════════════════════════════════
// SHOP
// ══════════════════════════════════════════════════════════
function renderShop() {
  const all = [...CATALOG, ...CITEMS];
  const cats = {};
  all.forEach(it => {
    const c = it.cat||it.category||'Especiais';
    if(!cats[c]) cats[c]=[];
    cats[c].push(it);
  });
  let html = '';
  for(const [sec, items] of Object.entries(cats)) {
    html += `<div class="shop-sec-title">${sec}</div><div class="shop-grid">`;
    items.forEach(it => {
      const owned = P.owned.includes(it.id);
      const equipped = P.slots[it.slot||it.s||'custom'] === it.id;
      const affordable = P.coins >= it.price;
      const tag = owned
        ? `<span class="s-tag s-tag-own">${equipped?'✓ Equipado':'✓ Possuído'}</span>`
        : `<span class="s-tag ${affordable?'s-tag-price':'s-tag-broke'}">🪙${it.price}</span>`;
      html += `<div class="s-card ${owned?'owned':''}" onclick="buyItem('${it.id}')">
        <div class="s-icon">${it.e||it.emoji}</div>
        <div class="s-name">${it.name}</div>
        ${tag}
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('shop-content').innerHTML = html;
}

function buyItem(id) {
  const item = CATALOG.find(x=>x.id===id) || CITEMS.find(x=>x.id===id);
  if(!item) return;
  if(P.owned.includes(id)) return;
  if(P.coins < item.price) {
    const el = document.getElementById('shop-content').querySelector(`[onclick="buyItem('${id}')"]`);
    if(el) { el.style.animation='shake .4s ease'; setTimeout(()=>el.style.animation='',500); }
    showToast(`Faltam 🪙${item.price-P.coins} moedas!`,'#f87171','#2a0808');
    return;
  }
  P.coins -= item.price;
  P.owned.push(id);
  const slot = item.slot || 'custom';
  P.slots[slot] = id;
  saveState();
  renderShop();
  updateAll();
  showEquipModal(item);
}

// ══════════════════════════════════════════════════════════
// EQUIP MODAL
// ══════════════════════════════════════════════════════════
let _danceInterval;
function showEquipModal(item) {
  const modal = document.getElementById('equip-modal');
  const charWrap = document.getElementById('eq-char-wrap');
  const emojiEl  = document.getElementById('eq-item-emoji');
  const nameEl   = document.getElementById('eq-name');
  const costEl   = document.getElementById('eq-cost');
  const btnEl    = document.getElementById('eq-close-btn');

  // Build char in modal
  charWrap.querySelectorAll('div').forEach(d=>{
    if(!d.id) d.remove();
  });
  buildCharSVG(160,213).forEach(el => {
    el.style.zIndex='1';
    charWrap.appendChild(el);
  });

  emojiEl.textContent = item.e||item.emoji;
  nameEl.textContent  = `${item.name} equipada! ✨`;
  costEl.textContent  = `-${item.price} 🪙 gastos`;
  [nameEl,costEl,btnEl].forEach(el=>{el.style.opacity='0';el.style.transform='translateY(14px)';});
  emojiEl.style.cssText='position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;';

  modal.style.animation='modal-in .3s ease-out';
  modal.classList.add('show');

  // Dance
  let phase=0;
  clearInterval(_danceInterval);
  _danceInterval = setInterval(()=>{
    phase+=0.12;
    const y=-15*Math.abs(Math.sin(phase));
    const r=5*Math.sin(phase);
    const sx=1-0.06*Math.abs(Math.sin(phase));
    charWrap.style.transform=`translateY(${y}px) rotate(${r}deg) scaleX(${sx})`;
  },30);

  // Item spin
  setTimeout(()=>{
    emojiEl.style.animation='spin-in .85s cubic-bezier(.34,1.56,.64,1) forwards';
    emojiEl.style.opacity='1';
  },300);

  // Reveal text
  setTimeout(()=>{
    nameEl.style.cssText='color:#fbbf24;font-size:16px;font-weight:700;opacity:1;transform:translateY(0);transition:opacity .5s,transform .5s;';
  },1300);
  setTimeout(()=>{
    costEl.style.cssText='color:#c084fc;font-size:12px;opacity:1;transform:translateY(0);transition:opacity .4s,transform .4s;';
  },1700);
  setTimeout(()=>{
    btnEl.style.cssText='background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:1;transition:opacity .4s;';
    burstParticles(modal, 160, 280);
    burstParticles(modal, 260, 260);
  },2000);
}
function closeEquipModal() {
  clearInterval(_danceInterval);
  const modal = document.getElementById('equip-modal');
  modal.classList.remove('show');
  document.getElementById('eq-char-wrap').style.transform='';
}

// ══════════════════════════════════════════════════════════
// PARENTS
// ══════════════════════════════════════════════════════════
let _pUnlocked = false;
let _pPin = '';

function renderParents() {
  document.getElementById('lock-btn').style.display = _pUnlocked ? 'block' : 'none';
  const el = document.getElementById('parents-content');
  if(!_pUnlocked) {
    el.innerHTML = `
      <div class="pin-wrap">
        <div style="font-size:38px;color:#7c3aed;">🔒</div>
        <div style="color:#c084fc;font-size:15px;font-weight:600;">Digite o PIN dos pais</div>
        <div class="pin-dots">
          ${[0,1,2,3].map(i=>`<div class="pin-dot ${i<_pPin.length?'on':''}" id="pd${i}"></div>`).join('')}
        </div>
        <div style="color:#7a5a9a;font-size:11px;">PIN correto: ${P.pin}</div>
        <div class="pin-grid">
          ${[1,2,3,4,5,6,7,8,9,'⌫',0,'✗'].map(k=>`<div class="pin-key" onclick="pinKey('${k}')">${k}</div>`).join('')}
        </div>
      </div>`;
    return;
  }
  // Unlocked content
  const pendingHTML = P.pending.length ? `
    <div class="sec-lbl">Aprovações pendentes</div>
    ${P.pending.map(p=>{
      const parts=p.split('|');
      return `<div class="appr-card">
        <div class="appr-title">${parts[1]||p}</div>
        <div class="appr-sub">Thomas marcou como concluída</div>
        <div class="appr-btns">
          <button class="btn-green" onclick="approveTask('${p}')">✓ Aprovar (+${parts[2]||0} XP)</button>
          <button class="btn-red2" onclick="rejectTask('${p}')">✗ Rejeitar</button>
        </div>
      </div>`;
    }).join('')}
  ` : '<div style="color:#7a5a9a;font-size:12px;margin-bottom:8px;">Nenhuma aprovação pendente.</div>';

  const ciHTML = CITEMS.length ? CITEMS.map(it=>`
    <div class="custom-row">
      <span>${it.e||it.emoji} ${it.name}</span>
      <span style="color:#fbbf24;font-size:11px;">🪙${it.price}</span>
      <span onclick="delCustomItem('${it.id}')" style="cursor:pointer;font-size:16px;">🗑️</span>
    </div>`).join('') : '<div style="color:#7a5a9a;font-size:12px;">Nenhum item cadastrado.</div>';

  const cmHTML = CMISSIONS.length ? CMISSIONS.map(m=>`
    <div class="custom-row">
      <span>${m.e||'⭐'} ${m.title}</span>
      <span style="color:#a78bcc;font-size:11px;">+${m.xp||m.xpReward} XP</span>
      <span onclick="delCustomMission('${m.id}')" style="cursor:pointer;font-size:16px;">🗑️</span>
    </div>`).join('') : '<div style="color:#7a5a9a;font-size:12px;">Nenhuma missão cadastrada.</div>';

  el.innerHTML = `
    ${pendingHTML}
    <div class="sec-lbl">➕ Cadastrar novo item</div>
    <div class="card-dark" style="display:flex;flex-direction:column;gap:8px;">
      <input id="fi-name"  class="dark-input" placeholder="Nome do item"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input id="fi-emoji" class="dark-input" placeholder="Emoji 🎁" maxlength="4"/>
        <input id="fi-price" class="dark-input" type="number" placeholder="Preço 🪙"/>
      </div>
      <select id="fi-cat" class="dark-select">
        ${['Roupas','Chapéus','Armas','Escudos','Pets','Especiais'].map(c=>`<option>${c}</option>`).join('')}
      </select>
      <button class="btn-purple" onclick="addCustomItem()">Adicionar Item à Loja</button>
    </div>
    <div class="sec-lbl">Itens dos pais</div>
    ${ciHTML}
    <div class="sec-lbl" style="margin-top:8px;">📋 Cadastrar nova missão</div>
    <div class="card-dark" style="display:flex;flex-direction:column;gap:8px;">
      <input id="mi-title" class="dark-input" placeholder="Nome da missão"/>
      <input id="mi-desc"  class="dark-input" placeholder="Descrição (opcional)"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
        <input id="mi-xp"   class="dark-input" type="number" placeholder="XP"/>
        <input id="mi-coin" class="dark-input" type="number" placeholder="Moedas 🪙"/>
      </div>
      <button class="btn-purple" onclick="addCustomMission()">Adicionar Missão</button>
    </div>
    <div class="sec-lbl" style="margin-top:8px;">Missões dos pais</div>
    ${cmHTML}
    <div class="sec-lbl" style="margin-top:8px;">Backup</div>
    <div class="card-dark">
      <div class="menu-row" onclick="exportBackup()"><span style="font-size:18px;">💾</span><span>Exportar backup (.json)</span></div>
      <div class="menu-row" onclick="importBackup()"><span style="font-size:18px;">📂</span><span>Restaurar backup</span></div>
      <div class="menu-row" onclick="resetMissions()"><span style="font-size:18px;">🔄</span><span>Resetar missões do dia</span></div>
    </div>
    <div style="height:20px;"></div>`;
}

function pinKey(k) {
  if(k==='⌫') { _pPin=_pPin.slice(0,-1); renderParents(); return; }
  if(k==='✗') { _pPin=''; renderParents(); return; }
  if(_pPin.length>=4) return;
  _pPin+=k;
  renderParents();
  if(_pPin.length===4) {
    setTimeout(()=>{
      if(_pPin===P.pin) { _pUnlocked=true; _pPin=''; renderParents(); }
      else { _pPin=''; showToast('PIN incorreto!','#f87171','#2a0808'); renderParents(); }
    },200);
  }
}
function lockParents() { _pUnlocked=false; _pPin=''; renderParents(); }

function approveTask(key) {
  const parts=key.split('|');
  const id=parts[0], xp=parseInt(parts[2])||0, coin=parseInt(parts[3])||0;
  P.xp+=xp; P.coins+=coin; P.done++;
  P.pending=P.pending.filter(p=>p!==key);
  const m=[...MISSIONS,...CMISSIONS].find(x=>x.id===id);
  if(m) m.status='approved';
  saveState(); updateAll(); renderParents();
}
function rejectTask(key) {
  const id=key.split('|')[0];
  P.pending=P.pending.filter(p=>p!==key);
  const m=[...MISSIONS,...CMISSIONS].find(x=>x.id===id);
  if(m) m.status='available';
  saveState(); renderParents();
}

function addCustomItem() {
  const name  = document.getElementById('fi-name').value.trim();
  const emoji = document.getElementById('fi-emoji').value.trim()||'🎁';
  const price = parseInt(document.getElementById('fi-price').value)||100;
  const cat   = document.getElementById('fi-cat').value;
  if(!name) return showToast('Digite o nome do item!','#f87171','#2a0808');
  CITEMS.push({id:'ci-'+Date.now(), name, e:emoji, emoji, price, cat, slot:'custom-'+CITEMS.length});
  saveState(); renderParents(); renderShop();
  showToast(`"${name}" adicionado à loja! 🎉`,'#34d399','#0a2a10');
}
function delCustomItem(id) {
  CITEMS=CITEMS.filter(i=>i.id!==id);
  saveState(); renderParents(); renderShop();
}
function addCustomMission() {
  const title = document.getElementById('mi-title').value.trim();
  const desc  = document.getElementById('mi-desc').value.trim()||'Missão especial';
  const xp    = parseInt(document.getElementById('mi-xp').value)||30;
  const coin  = parseInt(document.getElementById('mi-coin').value)||15;
  if(!title) return showToast('Digite o nome da missão!','#f87171','#2a0808');
  CMISSIONS.push({id:'cm-'+Date.now(), title, desc, xp, c:coin, e:'⭐', tag:'purple', status:'available'});
  saveState(); renderParents(); renderMissions();
  showToast(`"${title}" adicionada! 🎯`,'#34d399','#0a2a10');
}
function delCustomMission(id) {
  CMISSIONS=CMISSIONS.filter(m=>m.id!==id);
  saveState(); renderParents(); renderMissions();
}
function resetMissions() {
  MISSIONS.forEach(m=>{ if(m.status!=='available') m.status='available'; });
  CMISSIONS.forEach(m=>{ if(m.status!=='available') m.status='available'; });
  P.pending=[];
  saveState(); renderParents();
  showToast('Missões resetadas! 🔄','#c084fc','#2a1040');
}

// ══════════════════════════════════════════════════════════
// BACKUP
// ══════════════════════════════════════════════════════════
function exportBackup() {
  const data = {v:1, date:new Date().toISOString(), player:P, missions:MISSIONS, citems:CITEMS, cmissions:CMISSIONS};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'thomasworld-backup.json';
  a.click();
  showToast('Backup exportado! 💾','#34d399','#0a2a10');
}
function importBackup() {
  const input = document.createElement('input');
  input.type='file'; input.accept='.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const d = JSON.parse(ev.target.result);
        if(d.player)   P=d.player;
        if(d.missions) MISSIONS=d.missions;
        if(d.citems)   CITEMS=d.citems;
        if(d.cmissions)CMISSIONS=d.cmissions;
        saveState(); updateAll(); renderParents();
        showToast('Backup restaurado! ✅','#34d399','#0a2a10');
      } catch(_) { showToast('Erro ao restaurar backup!','#f87171','#2a0808'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

// ══════════════════════════════════════════════════════════
// CELEBRATIONS
// ══════════════════════════════════════════════════════════
function fireCelebration(refEl, xpVal, name) {
  const app = document.getElementById('app');
  const rect = refEl ? refEl.getBoundingClientRect() : {left:180,top:300,width:0,height:0};
  const ar = app.getBoundingClientRect();
  const cx = rect.left - ar.left + rect.width/2;
  const cy = rect.top  - ar.top  + rect.height/2;
  burstParticles(app, cx, cy);
  const banner = document.createElement('div');
  banner.className = 'cel-banner';
  banner.textContent = `🎯 +${xpVal} XP — ${name} concluída!`;
  banner.style.top = Math.max(55,cy-55)+'px';
  app.appendChild(banner);
  setTimeout(()=>banner.remove(), 2600);
}
function burstParticles(container, cx, cy) {
  const syms=['⭐','✨','🪙','💫','🎉','⚡','🌟'];
  for(let i=0;i<20;i++) {
    const a=(i/20)*Math.PI*2+Math.random()*.4, d=50+Math.random()*100;
    const p=document.createElement('div');
    p.className='burst-p';
    p.textContent=syms[Math.floor(Math.random()*syms.length)];
    const sz=13+Math.random()*12;
    p.style.cssText=`left:${cx}px;top:${cy}px;font-size:${sz}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--dur:${.7+Math.random()*.5}s;animation-delay:${Math.random()*.1}s;`;
    container.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  }
}

// ══════════════════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════════════════
let _toastTimer;
function showToast(msg, color, bg='#1a0a2e') {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.cssText=`position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;border:1px solid ${color};color:${color};background:${bg};display:block;`;
  clearTimeout(_toastTimer);
  _toastTimer=setTimeout(()=>t.style.display='none',2400);
}

// ══════════════════════════════════════════════════════════
// ANIMATED BACKGROUND
// ══════════════════════════════════════════════════════════
const canvas = document.getElementById('bgCanvas');
const ctx = canvas.getContext('2d');
let stars=[], t=0;
function resizeCanvas() {
  const app=document.getElementById('app');
  canvas.width=app.offsetWidth; canvas.height=app.offsetHeight;
}
function mkStars() {
  stars=Array.from({length:44},()=>({
    x:Math.random(),y:Math.random(),
    r:.5+Math.random()*2.5,
    ph:Math.random(),sp:.5+Math.random()
  }));
}
function drawBg() {
  const w=canvas.width, h=canvas.height;
  ctx.clearRect(0,0,w,h);
  // Orbs
  [[.15,.05,.35*w,.28*h,'#7c3aed',.07,18],[.55,.55,.28*w,.22*h,'#9333ea',.06,22],[.7,.15,.2*w,.18*h,'#c084fc',.05,15]].forEach(([ox,oy,rw,rh,col,op])=>{
    const gx=ox*w+20*Math.sin(t*.3),gy=oy*h+15*Math.cos(t*.25);
    const gr=ctx.createRadialGradient(gx,gy,0,gx,gy,rw*.7);
    gr.addColorStop(0,col+'28'); gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr; ctx.beginPath(); ctx.ellipse(gx,gy,rw/2,rh/2,0,0,Math.PI*2); ctx.fill();
  });
  // Stars
  stars.forEach(s=>{
    const op=.15+.75*(.5+.5*Math.sin((t*s.sp+s.ph)*2*Math.PI));
    ctx.beginPath(); ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${op})`; ctx.fill();
  });
  t+=.008;
  requestAnimationFrame(drawBg);
}

// ══════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════
loadState();
resizeCanvas(); mkStars(); drawBg();
['home','missions','shop','parents'].forEach(id => buildNav('nav-'+id, id));
updateAll();
renderMissions();

// Service Worker
if('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(()=>{});
}
window.addEventListener('resize', resizeCanvas);
</script>
