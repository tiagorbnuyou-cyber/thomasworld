<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;}
body{background:#1a0a2e;color:#e2d0f8;display:flex;align-items:center;justify-content:center;}
#app{width:100%;max-width:420px;height:100dvh;background:#1a0a2e;position:relative;overflow:hidden;display:flex;flex-direction:column;}
canvas#bgc{position:absolute;inset:0;pointer-events:none;z-index:0;}
.screen{display:none;flex-direction:column;height:100%;position:relative;z-index:1;}
.screen.active{display:flex;}
.hdr{background:rgba(18,6,42,.9);padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hdr-title{color:#c084fc;font-size:15px;font-weight:600;}
.coin-badge{display:flex;align-items:center;gap:5px;background:#2a1040;border-radius:20px;padding:4px 10px;color:#fbbf24;font-size:13px;font-weight:600;}
.xp-wrap{background:rgba(18,6,42,.9);padding:0 16px 10px;flex-shrink:0;}
.xp-row{display:flex;justify-content:space-between;font-size:11px;color:#a78bcc;margin-bottom:4px;}
.xp-track{background:#2a1040;border-radius:10px;height:8px;overflow:hidden;}
.xp-fill{background:#9333ea;height:100%;border-radius:10px;transition:width .8s ease;}
.nav{display:flex;background:#12062a;border-top:1px solid #3a1a5e;flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0 6px;background:none;border:none;cursor:pointer;color:#7a5a9a;font-size:9px;font-family:inherit;outline:none;}
.nb svg{width:22px;height:22px;pointer-events:none;} .nb span{pointer-events:none;} .nb.on{color:#c084fc;}
.hbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:8px 16px 16px;}
.lvlb{background:#7c3aed;color:#fff;font-size:11px;font-weight:600;padding:3px 16px;border-radius:20px;margin-bottom:6px;}
#cwrap{position:relative;width:190px;height:255px;flex-shrink:0;}
.stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;margin-top:10px;}
.sc{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:10px;text-align:center;}
.sc .v{color:#c084fc;font-size:20px;font-weight:600;} .sc .l{color:#7a5a9a;font-size:10px;margin-top:2px;}
.mlist{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.mc{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;-webkit-user-select:none;user-select:none;transition:opacity .2s;}
.mc:active{opacity:.75;} .mc.done{opacity:.5;} .mc.pend{border-color:#fbbf24;}
.mi{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px;}
.ct{background:#002a1a;} .ca{background:#2a1a00;} .cp{background:#2e1060;} .ck{background:#2a001a;}
.mt{color:#e2d0f8;font-size:13px;font-weight:500;} .md{color:#7a5a9a;font-size:11px;margin-top:2px;}
.mr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0;}
.pill{border-radius:20px;padding:2px 8px;font-size:10px;}
.pg{background:#2a1040;color:#fbbf24;} .ok{background:#0a2a10;color:#34d399;} .wt{background:#2a1a00;color:#fbbf24;}
.sbody{flex:1;overflow-y:auto;padding:10px 13px;}
.sst{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:8px 0 6px;}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.si{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:8px 6px;text-align:center;cursor:pointer;transition:opacity .15s;}
.si:active{opacity:.75;} .si.own{border-color:#34d399;}
.si .ie{font-size:24px;margin-bottom:4px;} .si .in{color:#e2d0f8;font-size:10px;font-weight:500;line-height:1.2;min-height:28px;display:flex;align-items:center;justify-content:center;}
.stg{border-radius:20px;padding:2px 6px;font-size:10px;display:inline-block;margin-top:4px;}
.tp{background:#2a1040;color:#fbbf24;} .to{background:#0a2a10;color:#34d399;} .tb{background:#2a0808;color:#f87171;}
.pbody{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.pin-area{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 0;}
.pdots{display:flex;gap:12px;}
.pd{width:14px;height:14px;border-radius:50%;background:#3a1a5e;border:1.5px solid #7c3aed;transition:background .2s;} .pd.on{background:#c084fc;}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:260px;}
.pk{background:#12062a;border:1px solid #3a1a5e;border-radius:12px;padding:14px 0;text-align:center;font-size:20px;color:#e2d0f8;cursor:pointer;font-weight:500;} .pk:active{background:#2a1040;}
.slbl{color:#a78bcc;font-size:10px;letter-spacing:.08em;text-transform:uppercase;margin:4px 0 8px;}
.cd{background:#12062a;border:1px solid #3a1a5e;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;}
.di{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;} .di:focus{border-color:#7c3aed;}
.ds{background:#0d0620;border:1px solid #3a1a5e;border-radius:8px;color:#e2d0f8;padding:8px 10px;font-size:12px;font-family:inherit;width:100%;outline:none;}
.bpu{background:#7c3aed;border:none;border-radius:10px;color:#fff;padding:10px;font-size:13px;font-family:inherit;cursor:pointer;width:100%;} .bpu:active{opacity:.85;}
.bgr{background:#0a2a10;border:1px solid #34d399;border-radius:8px;color:#34d399;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.brd{background:#2a0a10;border:1px solid #f87171;border-radius:8px;color:#f87171;font-size:12px;padding:8px;font-family:inherit;cursor:pointer;flex:1;}
.ac{background:#12062a;border:1.5px solid #fbbf24;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-bottom:1px solid #3a1a5e;} .mrow:last-child{border-bottom:none;}
.crow{display:flex;align-items:center;gap:8px;background:#0d0620;border-radius:8px;padding:7px 10px;} .crow span{color:#e2d0f8;font-size:12px;flex:1;}
#eqm{position:absolute;inset:0;background:rgba(8,2,20,.96);z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
#eqm.show{display:flex;}
#eqc{position:relative;width:160px;height:213px;transform-origin:bottom center;}
#eqe{position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;z-index:10;}
.eqtxt{color:#fbbf24;font-size:16px;font-weight:700;opacity:0;} .eqsub{color:#c084fc;font-size:12px;opacity:0;}
.eqbtn{background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:0;}
.bp{position:absolute;pointer-events:none;z-index:50;font-size:var(--sz);animation:burst var(--dur) ease-out forwards;}
.cban{position:absolute;left:50%;background:#7c3aed;color:#fff;padding:8px 18px;border-radius:24px;font-size:12px;font-weight:600;pointer-events:none;z-index:60;white-space:nowrap;animation:banpop 2.5s ease-out forwards;}
#toast{position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;display:none;}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.2);opacity:0;}}
@keyframes banpop{0%{opacity:0;transform:translateX(-50%) scale(.6);}15%{opacity:1;transform:translateX(-50%) scale(1.08);}25%{transform:translateX(-50%) scale(1);}80%{opacity:1;}100%{opacity:0;transform:translateX(-50%) scale(.8) translateY(-16px);}}
@keyframes spinin{0%{transform:translateX(-50%) translateY(-70px) rotate(540deg) scale(0);opacity:0;}55%{transform:translateX(-50%) translateY(8px) rotate(-20deg) scale(1.5);opacity:1;}70%{transform:translateX(-50%) translateY(-6px) rotate(10deg) scale(.85);}82%{transform:translateX(-50%) translateY(4px) rotate(-5deg) scale(1.1);}100%{transform:translateX(-50%) translateY(0) rotate(0) scale(1);opacity:1;}}
@keyframes min{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-3px);}80%{transform:translateX(3px);}}
</style>
</head>
<body>
<div id="app">

<!-- HOME -->

  <div class="pbody" id="pbody"></div>
  <nav class="nav" id="nav3"></nav>

<div id="eqm">

  <div id="eqc"><div id="eqe"></div></div>
  <div class="eqtxt" id="eqtxt"></div>
  <div class="eqsub" id="eqsub"></div>
  <button class="eqbtn" id="eqbtn" onclick="closeEq()">Incrível! 🎉</button>
</div>
<div id="toast"></div>
</div>

// ── CATALOG ────────────────────────────────────────────────

  {id:'crown-g',name:'Coroa Dourada',   price:400, e:'👑',cat:'Chapéus', slot:'head',  t:'crown-g'},
  {id:'crown-s',name:'Coroa de Prata',  price:250, e:'👑',cat:'Chapéus', slot:'head',  t:'crown-s'},
  {id:'helmet', name:'Elmo de Ferro',   price:350, e:'⛑️',cat:'Chapéus', slot:'head',  ep:[340,50,46]},
  {id:'wizard', name:'Chapéu Mago',     price:450, e:'🧙',cat:'Chapéus', slot:'head',  ep:[340,46,48]},
  {id:'cowboy', name:'Chapéu Cowboy',   price:300, e:'🤠',cat:'Chapéus', slot:'head',  ep:[340,46,46]},
  {id:'halo',   name:'Auréola',         price:500, e:'😇',cat:'Chapéus', slot:'head2', ep:[340,42,32]},
  {id:'sw-wood',name:'Espada Madeira',  price:80,  e:'🗡️',cat:'Armas',   slot:'weapon',t:'sw-wood'},
  {id:'sw-iron',name:'Espada Ferro',    price:200, e:'⚔️',cat:'Armas',   slot:'weapon',t:'sw-iron'},
  {id:'sw-leg', name:'Espada Lendária', price:600, e:'🗡️',cat:'Armas',   slot:'weapon',t:'sw-leg'},
  {id:'bow',    name:'Arco e Flecha',   price:350, e:'🏹',cat:'Armas',   slot:'weapon',ep:[455,370,40]},
  {id:'staff',  name:'Cajado Mágico',   price:500, e:'🪄',cat:'Armas',   slot:'weapon',ep:[455,360,40]},
  {id:'trident',name:'Tridente',        price:700, e:'🔱',cat:'Armas',   slot:'weapon',ep:[455,380,40]},
  {id:'hammer', name:'Martelo',         price:800, e:'🪓',cat:'Armas',   slot:'weapon',ep:[455,370,40]},
  {id:'sh-wood',name:'Escudo Madeira',  price:60,  e:'🛡️',cat:'Escudos', slot:'shield',t:'sh-wood'},

  {id:'dog',    name:'Cachorrinho',     price:250, e:'🐶',cat:'Pets',    slot:'pet',   ep:[192,488,44]},
  {id:'bunny',  name:'Coelho',          price:300, e:'🐰',cat:'Pets',    slot:'pet',   ep:[192,488,44]},
  {id:'fox',    name:'Raposa Mágica',   price:600, e:'🦊',cat:'Pets',    slot:'pet',   t:'fox'},
  {id:'dragon', name:'Dragãozinho',     price:1200,e:'🐉',cat:'Pets',    slot:'pet',   t:'dragon'},

  {id:'rainbow',name:'Aura Arco-íris',  price:1800,e:'🌈',cat:'Especiais',slot:'back', ep:[340,200,90]},

const DMS=[
  {id:'m1', title:'Escovar os dentes',    desc:'Manhã e noite',          xp:30, c:20,e:'🦷',tag:'teal'},
  {id:'m2', title:'Ler 15 minutos',       desc:'Qualquer livro',          xp:50, c:30,e:'📖',tag:'amber'},
  {id:'m3', title:'Arrumar a cama',       desc:'Todo dia de manhã',       xp:30, c:15,e:'🛏️',tag:'purple'},
  {id:'m4', title:'Guardar as roupas',    desc:'Deixar tudo no lugar',    xp:25, c:15,e:'👕',tag:'pink'},
  {id:'m5', title:'Dever de casa',        desc:'Todas as matérias',       xp:80, c:50,e:'📚',tag:'teal'},
  {id:'m6', title:'Tomar banho',          desc:'Sem precisar pedir',      xp:40, c:25,e:'🚿',tag:'amber'},
  {id:'m7', title:'Arrumar a mesa',       desc:'Antes do jantar',         xp:35, c:20,e:'🍽️',tag:'purple'},

  {id:'m10',title:'Guardar brinquedos',   desc:'Depois de brincar',       xp:25, c:15,e:'🧸',tag:'amber'},
];

// ── STATE ──────────────────────────────────────────────────
let P={coins:500,xp:0,done:0,owned:[],slots:{},pin:'1234',pending:[]};
let MS=DMS.map(m=>({...m,st:'ok'}));
let CI=[],CM=[];

function loadData(){
  try{
    const p=localStorage.getItem('tw3-p');
    if(p) P=JSON.parse(p);
    const m=localStorage.getItem('tw3-m');
    if(m){
      const sv=JSON.parse(m);
      // Sempre reconstrói a partir do padrão, preservando apenas o status
      MS=DMS.map(d=>{const s=sv.find(x=>x.id===d.id);return{...d,st:s?s.st:'ok'};});
    }
    const ci=localStorage.getItem('tw3-ci'); if(ci) CI=JSON.parse(ci);
    const cm=localStorage.getItem('tw3-cm'); if(cm) CM=JSON.parse(cm);
  }catch(e){console.warn('load err',e);}
}
function saveData(){
  try{
    localStorage.setItem('tw3-p',JSON.stringify(P));
    localStorage.setItem('tw3-m',JSON.stringify(MS));
    localStorage.setItem('tw3-ci',JSON.stringify(CI));
    localStorage.setItem('tw3-cm',JSON.stringify(CM));
  }catch(e){}
}

// ── NÍVEIS ────────────────────────────────────────────────
const XL=[0,200,500,1000,2000,3500,5500,8000,11000,15000];
const LT=['🌱 Novato Aventureiro','⚔️ Guerreiro Iniciante','🛡 Escudeiro Bravo','🗡️ Cavaleiro Corajoso','👑 Herói do Reino','🔱 Lendário','🌟 Mestre Supremo','💎 Campeão','🦅 Guardião','🔥 Lenda Imortal'];
function getLv(){let l=1;for(let i=1;i<XL.length;i++){if(P.xp>=XL[i])l=i+1;else break;}return l;}
function getLvT(l){return LT[Math.min(l-1,LT.length-1)];}
function getXpPct(){const l=getLv();const c=XL[Math.min(l-1,XL.length-1)];const n=XL[Math.min(l,XL.length-1)];return n>c?Math.min(100,(P.xp-c)/(n-c)*100):100;}
function getNextXp(){return XL[Math.min(getLv(),XL.length-1)];}

// ── SVG SYSTEM ────────────────────────────────────────────
const VB='viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg"';
// IMPORTANTE: usa template literal JS para interpolar w e h corretamente

// Cria div com SVG já dimensionado corretamente
function mkLayer(svgStr,w,h){
  const d=document.createElement('div');
  d.style.cssText=`position:absolute;top:0;left:0;width:${w}px;height:${h}px;`;
  d.innerHTML=svgStr;
  return d;
}

// ── RENDER CHARACTER ───────────────────────────────────────
function renderChar(container,w,h){
  container.innerHTML='';
  container.style.cssText=`position:relative;width:${w}px;height:${h}px;flex-shrink:0;`;
  const G=id=>CAT.find(x=>x.id===id)||CI.find(x=>x.id===id);
  const sh=P.slots.shirt  ?G(P.slots.shirt):null;
  const jk=P.slots.jacket ?G(P.slots.jacket):null;
  const pa=P.slots.pants  ?G(P.slots.pants):null;
  const so=P.slots.shoes  ?G(P.slots.shoes):null;
  const hd=P.slots.head   ?G(P.slots.head):null;
  const h2=P.slots.head2  ?G(P.slots.head2):null;
  const wp=P.slots.weapon ?G(P.slots.weapon):null;
  const sc=P.slots.shield ?G(P.slots.shield):null;
  const pt=P.slots.pet    ?G(P.slots.pet):null;
  const bk=P.slots.back   ?G(P.slots.back):null;
  const add=s=>container.appendChild(mkLayer(s,w,h));
  // Camada de trás
  if(bk&&bk.ep)  add(mkEs(bk.e,bk.ep[0],bk.ep[1],bk.ep[2],w,h));
  if(jk&&jk.t==='cape') add(LY.capeBhd(w,h));
  // Personagem base
  add(LY.base(w,h));
  // Roupas
  if(sh&&!jk)    add(LY.shirt(sh.c,w,h));
  if(jk){
    if(jk.t==='cape')  add(LY.capeFnt(w,h));
    else if(jk.t==='armor') add(LY.armor(w,h));
    else add(LY.jacket(jk.c,w,h));
  }
  if(pa) add(LY.pants(pa.c,w,h));
  if(so) add(so.t==='boots'?LY.boots(w,h):LY.shoes(so.c,w,h));
  // Equipamentos
  const shMap={'sh-wood':LY.shWood,'sh-iron':LY.shIron,'sh-mag':LY.shMag};
  if(sc&&shMap[sc.t]) add(shMap[sc.t](w,h));
  const wpMap={'sw-wood':LY.swWood,'sw-iron':LY.swIron,'sw-leg':LY.swLeg};
  if(wp){if(wpMap[wp.t])add(wpMap[wp.t](w,h));else if(wp.ep)add(mkEs(wp.e,wp.ep[0],wp.ep[1],wp.ep[2],w,h));}
  // Chapéus
  if(hd){
    if(hd.t==='crown-g') add(LY.crownG(w,h));
    else if(hd.t==='crown-s') add(LY.crownS(w,h));
    else if(hd.ep) add(mkEs(hd.e,hd.ep[0],hd.ep[1],hd.ep[2],w,h));
  }
  if(h2&&h2.ep) add(mkEs(h2.e,h2.ep[0],h2.ep[1],h2.ep[2],w,h));
  // Pet
  if(pt){
    if(pt.t==='fox') add(LY.fox(w,h));
    else if(pt.t==='dragon') add(LY.dragon(w,h));
    else if(pt.ep) add(mkEs(pt.e,pt.ep[0],pt.ep[1],pt.ep[2],w,h));
  }
  // Itens custom (emoji flutuante)
  CI.filter(i=>P.owned.includes(i.id)).slice(0,3).forEach((it,idx)=>{
    const ps=[[488,488,36],[192,420,32],[488,420,32]];
    add(mkEs(it.e||'🎁',ps[idx][0],ps[idx][1],ps[idx][2],w,h));
  });
}

// ── UPDATE HOME ────────────────────────────────────────────
function upd(){
  const l=getLv();
  document.querySelectorAll('.cd').forEach(el=>el.textContent=P.coins);
  document.getElementById('hlvl').textContent=`Nível ${l} — ${getLvT(l).split(' ').slice(1).join(' ')}`;
  document.getElementById('hxp').textContent=`${P.xp} / ${getNextXp()} XP`;
  document.getElementById('hbar').style.width=getXpPct()+'%';
  document.getElementById('hbadge').textContent=getLvT(l);
  document.getElementById('slv').textContent=l;
  document.getElementById('sms').textContent=P.done;
  document.getElementById('sit').textContent=P.owned.length;
  renderChar(document.getElementById('cwrap'),190,255);
}

const TABS=[
  {id:'home',    l:'Início',  p:'M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z'},
  {id:'missions',l:'Missões', p:'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2'},
  {id:'shop',    l:'Loja',    p:'M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4zM3 6h18M16 10a4 4 0 01-8 0'},
  {id:'parents', l:'Pais',    p:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'},
];
function buildNav(el,active){
  el.innerHTML=TABS.map(t=>`<button class="nb ${t.id===active?'on':''}" onclick="goTo('${t.id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${t.p}"/></svg><span>${t.l}</span></button>`).join('');
}
function goTo(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('s-'+id).classList.add('active');
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.getAttribute('onclick')===`goTo('${id}')`));
  if(id==='missions') renderMissions();
  else if(id==='shop') renderShop();
  else if(id==='parents') renderParents();
  else upd();
}

// ── MISSIONS ───────────────────────────────────────────────
function renderMissions(){
  const all=[...MS,...CM];
  const el=document.getElementById('mlist');
  if(all.length===0){el.innerHTML='<div style="color:#7a5a9a;padding:20px;text-align:center;">Nenhuma missão.</div>';return;}
  el.innerHTML=all.map(m=>{
    const done=m.st==='done';
    const pend=m.st==='pend';
    const pill=done?`<span class="pill ok">✓ Feito</span>`:pend?`<span class="pill wt">⏳ Aguardando</span>`:'';
    const cls='c'+(m.tag==='teal'?'t':m.tag==='amber'?'a':m.tag==='pink'?'k':'p');
    return `<div class="mc ${done?'done':''} ${pend?'pend':''}" onclick="markM('${m.id}')">
      <div class="mi ${cls}">${m.e||m.emoji||'⭐'}</div>
      <div style="flex:1;min-width:0;"><div class="mt">${m.title}</div><div class="md">${m.desc||m.description||''}</div></div>
      <div class="mr"><span class="pill pg">+${m.xp||m.xpReward||0} XP</span>${pill}</div>
    </div>`;
  }).join('');
}
function markM(id){
  const all=[...MS,...CM];
  const m=all.find(x=>x.id===id);
  if(!m||m.st==='done'||m.st==='pend') return;
  m.st='pend';
  P.done++;  // ← CORRIGIDO: incrementa aqui, quando filho marca
  P.pending.push(`${id}|${m.title}|${m.xp||m.xpReward||0}|${m.c||m.coinReward||0}`);
  saveData(); renderMissions(); upd();
  const ref=event&&event.currentTarget?event.currentTarget:null;
  doBurst(ref,m.xp||30,m.title);
}

// ── SHOP ───────────────────────────────────────────────────
function renderShop(){
  const all=[...CAT,...CI];
  const cats={};
  all.forEach(it=>{const c=it.cat||'Especiais';if(!cats[c])cats[c]=[];cats[c].push(it);});
  let h='';
  for(const [sec,items] of Object.entries(cats)){
    h+=`<div class="sst">${sec}</div><div class="sgrid">`;
    items.forEach(it=>{
      const ow=P.owned.includes(it.id);
      const eq=P.slots[it.slot||'_']===it.id;
      const can=P.coins>=it.price;
      const tag=ow?`<span class="stg to">${eq?'✓ Equip.':'✓ Posse'}</span>`:`<span class="stg ${can?'tp':'tb'}">🪙${it.price}</span>`;
      h+=`<div class="si ${ow?'own':''}" onclick="buyIt('${it.id}')"><div class="ie">${it.e||it.emoji}</div><div class="in">${it.name}</div>${tag}</div>`;
    });
    h+='</div>';
  }
  document.getElementById('sbody').innerHTML=h;
}
function buyIt(id){
  const it=CAT.find(x=>x.id===id)||CI.find(x=>x.id===id);
  if(!it||P.owned.includes(id)) return;
  if(P.coins<it.price){
    const el=document.querySelector(`[onclick="buyIt('${id}')"]`);
    if(el){el.style.animation='shake .4s ease';setTimeout(()=>el.style.animation='',500);}
    toast(`Faltam 🪙${it.price-P.coins}!`,'#f87171','#2a0808');return;
  }
  P.coins-=it.price; P.owned.push(id); P.slots[it.slot||'_']=id;
  saveData(); renderShop(); upd(); showEq(it);
}

// ── EQUIP MODAL ────────────────────────────────────────────
let _di;
function showEq(it){
  const modal=document.getElementById('eqm');
  const ec=document.getElementById('eqc');
  ec.querySelectorAll('div:not(#eqe)').forEach(d=>d.remove());
  renderChar(ec,160,213);
  const ee=document.getElementById('eqe');
  ee.textContent=it.e||it.emoji;
  ee.style.cssText='position:absolute;top:-50px;left:50%;transform:translateX(-50%);font-size:52px;opacity:0;z-index:10;';
  const eqtxt=document.getElementById('eqtxt');
  const eqsub=document.getElementById('eqsub');
  const eqbtn=document.getElementById('eqbtn');
  eqtxt.style.opacity='0'; eqsub.style.opacity='0'; eqbtn.style.opacity='0';
  eqtxt.textContent=`${it.name} equipada! ✨`;
  eqsub.textContent=`-${it.price} 🪙 gastos`;
  modal.style.animation='min .3s ease-out'; modal.classList.add('show');
  let ph=0; clearInterval(_di);
  _di=setInterval(()=>{ph+=.12;const y=-14*Math.abs(Math.sin(ph));const r=5*Math.sin(ph);const sx=1-.05*Math.abs(Math.sin(ph));ec.style.transform=`translateY(${y}px) rotate(${r}deg) scaleX(${sx})`;},30);
  setTimeout(()=>{ee.style.animation='spinin .85s cubic-bezier(.34,1.56,.64,1) forwards';ee.style.opacity='1';},300);
  setTimeout(()=>{eqtxt.style.cssText='color:#fbbf24;font-size:16px;font-weight:700;opacity:1;transition:opacity .5s;';},1300);
  setTimeout(()=>{eqsub.style.cssText='color:#c084fc;font-size:12px;opacity:1;transition:opacity .4s;';},1700);
  setTimeout(()=>{
    eqbtn.style.cssText='background:#7c3aed;border:none;border-radius:20px;color:#fff;padding:9px 28px;font-size:13px;font-family:inherit;cursor:pointer;opacity:1;transition:opacity .4s;';
    doBurst2(document.getElementById('app'),160,280); doBurst2(document.getElementById('app'),240,260);
  },2000);
  setTimeout(()=>closeEq(),6000);
}
function closeEq(){clearInterval(_di);document.getElementById('eqm').classList.remove('show');document.getElementById('eqc').style.transform='';}

// ── PARTICLES ─────────────────────────────────────────────
const SY=['⭐','✨','🪙','💫','🎉','⚡','🌟'];
function doBurst(refEl,xpv,name){
  const app=document.getElementById('app');
  const ar=app.getBoundingClientRect();
  const rr=refEl?refEl.getBoundingClientRect():{left:ar.left+180,top:ar.top+300,width:0,height:0};
  const cx=rr.left-ar.left+rr.width/2, cy=rr.top-ar.top+rr.height/2;
  doBurst2(app,cx,cy);
  const ban=document.createElement('div');ban.className='cban';
  ban.textContent=`🎯 +${xpv} XP — ${name}!`;ban.style.top=Math.max(55,cy-55)+'px';
  app.appendChild(ban);setTimeout(()=>ban.remove(),2600);
}
function doBurst2(container,cx,cy){
  for(let i=0;i<18;i++){
    const a=(i/18)*Math.PI*2+Math.random()*.4,d=50+Math.random()*100;
    const p=document.createElement('div');p.className='bp';
    p.textContent=SY[i%SY.length];const z=13+Math.random()*11;
    p.style.cssText=`left:${cx}px;top:${cy}px;--sz:${z}px;--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px;--dur:${.7+Math.random()*.5}s;animation-delay:${Math.random()*.1}s;`;
    container.appendChild(p);setTimeout(()=>p.remove(),1500);
  }
}

// ── PARENTS ────────────────────────────────────────────────
let _pu=false,_pp='';
function renderParents(){
  document.getElementById('lkbtn').style.display=_pu?'block':'none';
  const el=document.getElementById('pbody');
  if(!_pu){
    el.innerHTML=`<div class="pin-area">
      <div style="font-size:38px;color:#7c3aed;">🔒</div>
      <div style="color:#c084fc;font-size:15px;font-weight:600;">PIN dos pais</div>
      <div class="pdots">${[0,1,2,3].map(i=>`<div class="pd ${i<_pp.length?'on':''}"></div>`).join('')}</div>
      <div style="color:#7a5a9a;font-size:11px;">PIN: ${P.pin}</div>
      <div class="pgrid">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✗'].map(k=>`<div class="pk" onclick="pk('${k}')">${k}</div>`).join('')}</div>
    </div>`;return;
  }
  const pHTML=P.pending.length?P.pending.map(p=>{const pts=p.split('|');return `<div class="ac"><div style="color:#e2d0f8;font-size:13px;font-weight:500;">${pts[1]||p}</div><div style="color:#7a5a9a;font-size:11px;">Thomas marcou como concluída</div><div style="display:flex;gap:8px;margin-top:4px;"><button class="bgr" onclick="appr('${p}')">✓ Aprovar (+${pts[2]||0}XP)</button><button class="brd" onclick="rej('${p}')">✗ Rejeitar</button></div></div>`}).join(''):`<div style="color:#7a5a9a;font-size:12px;">Sem aprovações pendentes.</div>`;
  const ciH=CI.length?CI.map(it=>`<div class="crow"><span>${it.e||'🎁'} ${it.name}</span><span style="color:#fbbf24;font-size:11px;">🪙${it.price}</span><span onclick="delCI('${it.id}')" style="cursor:pointer;">🗑️</span></div>`).join(''):`<div style="color:#7a5a9a;font-size:12px;">Nenhum item.</div>`;
  const cmH=CM.length?CM.map(m=>`<div class="crow"><span>⭐ ${m.title}</span><span style="color:#a78bcc;font-size:11px;">+${m.xp||0}XP</span><span onclick="delCM('${m.id}')" style="cursor:pointer;">🗑️</span></div>`).join(''):`<div style="color:#7a5a9a;font-size:12px;">Nenhuma missão.</div>`;
  el.innerHTML=`
    <div class="slbl">Aprovações</div>${pHTML}
    <div class="slbl" style="margin-top:8px;">➕ Novo Item</div>
    <div class="cd">
      <input id="fi-n" class="di" placeholder="Nome do item"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="fi-e" class="di" placeholder="Emoji 🎁" maxlength="4"/><input id="fi-p" class="di" type="number" placeholder="Preço 🪙"/></div>
      <select id="fi-c" class="ds">${['Roupas','Chapéus','Armas','Escudos','Pets','Especiais'].map(c=>`<option>${c}</option>`).join('')}</select>
      <button class="bpu" onclick="addCI()">Adicionar à Loja</button>
    </div>
    <div class="slbl" style="margin-top:8px;">Itens dos pais</div>${ciH}
    <div class="slbl" style="margin-top:8px;">📋 Nova Missão</div>
    <div class="cd">
      <input id="mi-t" class="di" placeholder="Nome da missão"/>
      <input id="mi-d" class="di" placeholder="Descrição (opcional)"/>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><input id="mi-x" class="di" type="number" placeholder="XP"/><input id="mi-c" class="di" type="number" placeholder="Moedas 🪙"/></div>
      <button class="bpu" onclick="addCM()">Adicionar Missão</button>
    </div>
    <div class="slbl" style="margin-top:8px;">Missões dos pais</div>${cmH}
    <div class="slbl" style="margin-top:8px;">Backup</div>
    <div class="cd">
      <div class="mrow" onclick="expBk()"><span style="font-size:18px;">💾</span><span>Exportar backup (.json)</span></div>
      <div class="mrow" onclick="impBk()"><span style="font-size:18px;">📂</span><span>Restaurar backup</span></div>
      <div class="mrow" onclick="rstMs()"><span style="font-size:18px;">🔄</span><span>Resetar missões do dia</span></div>
    </div><div style="height:20px;"></div>`;
}
function pk(k){
  if(k==='⌫'){_pp=_pp.slice(0,-1);renderParents();return;}
  if(k==='✗'){_pp='';renderParents();return;}
  if(_pp.length>=4) return;
  _pp+=k; renderParents();
  if(_pp.length===4){setTimeout(()=>{
    if(_pp===P.pin){_pu=true;_pp='';renderParents();}
    else{_pp='';toast('PIN incorreto!','#f87171','#2a0808');renderParents();}
  },200);}
}
function lockP(){_pu=false;_pp='';renderParents();}
function appr(key){
  const pts=key.split('|');
  P.xp+=parseInt(pts[2])||0; P.coins+=parseInt(pts[3])||0;
  // P.done já foi incrementado quando marcou, não incrementa de novo
  P.pending=P.pending.filter(x=>x!==key);
  const m=[...MS,...CM].find(x=>x.id===pts[0]);
  if(m) m.st='done';
  saveData(); upd(); renderParents();
}
function rej(key){
  const pts=key.split('|');
  P.done=Math.max(0,P.done-1); // desfaz o incremento
  P.pending=P.pending.filter(x=>x!==key);
  const m=[...MS,...CM].find(x=>x.id===pts[0]);
  if(m) m.st='ok';
  saveData(); upd(); renderParents();
}
function addCI(){
  const n=document.getElementById('fi-n').value.trim();
  if(!n) return toast('Nome obrigatório!','#f87171','#2a0808');
  const e=document.getElementById('fi-e').value.trim()||'🎁';
  const p=parseInt(document.getElementById('fi-p').value)||100;
  const c=document.getElementById('fi-c').value;
  CI.push({id:'ci'+Date.now(),name:n,e,emoji:e,price:p,cat:c,slot:'cx'+CI.length});
  saveData();renderParents();renderShop();toast(`"${n}" adicionado!`,'#34d399','#0a2a10');
}
function delCI(id){CI=CI.filter(x=>x.id!==id);saveData();renderParents();renderShop();}
function addCM(){
  const t=document.getElementById('mi-t').value.trim();
  if(!t) return toast('Nome obrigatório!','#f87171','#2a0808');
  const d=document.getElementById('mi-d').value.trim()||'Missão especial';
  const x=parseInt(document.getElementById('mi-x').value)||30;
  const c=parseInt(document.getElementById('mi-c').value)||15;
  CM.push({id:'cm'+Date.now(),title:t,desc:d,xp:x,c,e:'⭐',tag:'purple',st:'ok'});
  saveData();renderParents();renderMissions();toast(`"${t}" adicionada!`,'#34d399','#0a2a10');
}
function delCM(id){CM=CM.filter(x=>x.id!==id);saveData();renderParents();}
function rstMs(){MS.forEach(m=>m.st='ok');CM.forEach(m=>m.st='ok');P.pending=[];saveData();renderParents();renderMissions();toast('Missões resetadas! 🔄','#c084fc','#2a1040');}
function expBk(){const b=new Blob([JSON.stringify({v:3,P,MS,CI,CM})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='thomasworld.json';a.click();toast('Backup exportado! 💾','#34d399','#0a2a10');}
function impBk(){const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.P)P=d.P;if(d.MS){MS=DMS.map(dm=>{const s=d.MS.find(x=>x.id===dm.id);return{...dm,st:s?s.st:'ok'};});}if(d.CI)CI=d.CI;if(d.CM)CM=d.CM;saveData();upd();renderParents();toast('Backup restaurado!','#34d399','#0a2a10');}catch(err){toast('Erro no backup!','#f87171','#2a0808');}};r.readAsText(f);};i.click();}

// ── TOAST ──────────────────────────────────────────────────
let _tt;
function toast(msg,col,bg='#1a0a2e'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.cssText=`position:absolute;bottom:75px;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:20px;font-size:12px;pointer-events:none;z-index:150;white-space:nowrap;border:1px solid ${col};color:${col};background:${bg};display:block;`;
  clearTimeout(_tt);_tt=setTimeout(()=>t.style.display='none',2400);
}

// ── BACKGROUND ─────────────────────────────────────────────
const cv=document.getElementById('bgc'),ctx=cv.getContext('2d');
let stars=[],bt=0;
function initBg(){
  const a=document.getElementById('app');
  cv.width=a.offsetWidth;cv.height=a.offsetHeight;
  stars=Array.from({length:40},(_,i)=>({x:(i*137.5%100)/100,y:(i*97.3%100)/100,r:.5+i%3*.8,ph:i*.25,sp:.4+i%3*.3}));
}
function drawBg(){
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  [[.15,.05,.35,.28,'#7c3aed'],[.55,.55,.28,.22,'#9333ea'],[.7,.15,.2,.18,'#c084fc']].forEach(([ox,oy,rw,rh,col])=>{
    const gx=ox*w+18*Math.sin(bt*.3),gy=oy*h+13*Math.cos(bt*.25);
    const gr=ctx.createRadialGradient(gx,gy,0,gx,gy,rw*w*.7);
    gr.addColorStop(0,col+'22');gr.addColorStop(1,'transparent');
    ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(gx,gy,rw*w/2,rh*h/2,0,0,Math.PI*2);ctx.fill();
  });
  stars.forEach(s=>{
    const op=.12+.7*(.5+.5*Math.sin((bt*s.sp+s.ph)*Math.PI*2));
    ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${op})`;ctx.fill();
  });
  bt+=.008;requestAnimationFrame(drawBg);
}

// ── INIT ───────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  loadData();
  initBg(); drawBg();
  [0,1,2,3].forEach(i=>buildNav(document.getElementById('nav'+i),['home','missions','shop','parents'][i]));
  upd();
  renderMissions();
  window.addEventListener('resize',initBg);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
</script>
